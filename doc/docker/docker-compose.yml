version : '3.8'
services:
  benma666-mysql:
    container_name: benma666-mysql
    image: mysql
    build:
      context: ./mysql
    ports:
      - "3316:3306"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./mysql/data/conf:/etc/mysql/conf.d
      - ./mysql/data/logs:/logs
      - ./mysql/data/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'sjsj2_zs'
      MYSQL_ROOT_PASSWORD: password
  benma666-redis:
    container_name: benma666-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6389:6379"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./redis/data/redis.conf:/benma666/redis/redis.conf
      - ./redis/data/data:/data
    command: redis-server /benma666/redis/redis.conf
  benma666-nginx:
    container_name: benma666-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "8091:8091"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./nginx/data:/benma666
      - ./nginx/data/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/data/logs:/var/log/nginx
      - ./nginx/data/conf.d:/etc/nginx/conf.d
    depends_on:
      - benma666-sjsj
    links:
      - benma666-sjsj
  benma666-sjsj:
    container_name: benma666-sjsj
    build:
      context: ./sjsj
      dockerfile: dockerfile
    ports:
      - "8090:8090"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./sjsj/data:/benma666
      #- ./sjsj/data/logs:/benma666/logs
    environment:
      ENV: development
      SHOW: 'true'
    depends_on:
      - benma666-redis
      - benma666-mysql
    links:
      - benma666-redis
      - benma666-mysql
