  # 授权模式，cllx（精确到处理类型），sjdx（只要相关数据对象有授权就可以使用其下所有方法），默认为cllx
  xtqx-sqms: cllx
  # 配置的字典类别列表
  config-list: SYS_COMMON_APPCONFIG,SYS_MYSERVICE_APPCONFIG,SYS_SJGL_APPCONFIG
  # 密码解密密码
  fwq-ejmm: xxx
  # 密码解密密码
  sjzt-ejmm: xxx
  # 用户目前采用md5加密不需要设置密码
  yhxx-ejmm: xxx
  # 密码解密密码
  app-ejmm: xxx
  # 应用代码，没有应用都要独立的应用代码，与应用管理中的代码一致
  app-dm: sjsj
  #  datasource:
  #    kettle_default:
  #      ljc: jdbc:mysql://xxx:3306/xxxx?useOldAliasMetadataBehavior=true&characterEncoding=utf-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
  #      yhm: root
  #      mm: xxx
  #      lx: mysql
  #      kzxx-obj:
  #        kettleConfig:
  #          kuser: admin
  #          kpass: admin
  login:
    default-login: true
    # 登录失败次数
    dlsbcs: 5
    # 请求并发限制
    qqbfxz: 10
    # 用户同时在线会话数限制
    tszxhhsxz: 20
    # ip限制
#    ipxz: (123.147.251.132|123.147.249.154|27.11.159.27)
  service:
    # 统一代理地址，应用管理中统一代理的应用都只配置了项目名称，需要读取该配置补充为完整的地址
    tydlzd: http://localhost:9002
    addr: /index
    # 允许上传的文件类型
    yxscwjlx: xls,xlsx,txt,csv,zip,rar,7z,png,jpg,json,xml,pdf,doc,docx,ppt,pptx,mp3,mp4,ofd
    # 系统根目录
    xtgml: /benma666
  data:
    # 系统主密码
    password: xxx
    # sm2私钥
    private-key: xxx
    # sm2公钥
    public-key: xxx
  # 智能交换
  znjh:
    # 自动穿透调用，默认true
    zdctdy: true
    # 穿透调用等待时长
    ctdydd: 120000
    # 默认地址
    url: /default
    # 默认用户,专用同步账号
