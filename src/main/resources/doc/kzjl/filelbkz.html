<!-- 文件管理列表扩展 -->
<my-list id="listPage" :fromdata="fromdata" :sjdxid="sjdxid">
	<span :id="'lbplcz-'+sjdxid"></span>
</my-list>
<script type="text/x-tp" id="my-sjdx-lbplcz-tp">
<span>
{{if qxByQxm(user,sjdx,'WJSC')}}
<button class="btn btn-primary btn-sm uploadFile" wjlb="other" ywdm="common">
	<i class="icon ion-arrow-up-a"></i> {{= qxByQxm(user,sjdx,'WJSC').mc}}
</button>
{{/if}}
</span>
</script>
<script type="text/x-tp" id="my-sjdx-lbcz-tp">
<span>
{{if qxByQxm(user,sjdx,'WJXZ')}}
<span class="divider"></span>
<a href="javascript:download('{{= row.id}}');" title="文件下载"><i class="icon ion-arrow-down-a"></i></a>
{{/if}}
</span>
</script>
<script>
function sjdxZdy(vp){
    vp.el="#listPage";
    vp.methods.plcl=function(cllx,_this,options){
          this.$children[0].plcl(cllx,_this,options);
    }
    vp.mounted=function(){
        lbplcz(this);
    }
}
function plcl(cllx,_this,options){
    listFrom.plcl(cllx,_this,options);
}
function lbplcz(_this){
    var qtcz = $("#my-sjdx-lbplcz-tp").tmpl({sjdx:_this.sjdx,
        user:_this.$children[0]._data.user}).html();
    $('#lbplcz-'+_this.sjdxid).html(qtcz);
}
function sjdxlbcz(value,_this) {
    var cz = defaultLbcz(value,_this);
    if("非列表模式"==cz){
        return cz;
    }
    var qtcz = $("#my-sjdx-lbcz-tp").tmpl({
        sjdx:_this.$root.sjdx,
        user:_this.$parent.$parent.$parent._data.user,
	    row:_this.$root.listPage.rows[_this.$parent.$parent.ri]}).html();
    return cz+qtcz;
}
function tpzs(value,_this) {
    if(!_this.$root.listPage.rows||!_this.$root.listPage.rows[_this.$parent.$parent.ri]){
        return "";
    }
    var row = _this.$root.listPage.rows[_this.$parent.$parent.ri];
    var nr = "查看";
    if(row.wjlx=="png"||row.wjlx=="jpg"){
        nr = "<img style='width:60px;' src='common/download.do?xzms=false&id="+row.id+"'/>";
    }
    return "<a href='common/download.do?xzms=false&id="+row.id+"' target='_blank'>"+nr+"</a>";
}
</script>
