<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="format-detection" content="telephone=no"/>
    <meta name="format-detection" content="email=no"/>
    <meta http-equiv="Cache-Control" content="no-cache"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <script src="../jquery/jquery-1.9.1.min.js"></script>
    <script src="sockjs-1.1.4.js"></script>
    <script src="stomp-2.3.3.js"></script>
</head>
<body class="test">
<script>
    $(function(){
    	//定义stomp连接服务器的地址：只需要一次HTTP握手就可以进行连接。整个通讯过程是建立在一次连接/状态中，也就避免了HTTP的非状态性
        var url = '../../myws/server';
        var headers={
                username:'admin',
                password:'admin'
            };
        var socket = new SockJS(url, undefined, {transports: ['websocket']});
        //新建stomp客户端
        var stompClient = Stomp.over(socket);
      	//stomp请求与服务器建立连接 connet({},function(),function())第一个参数Map是请求的头信息，第二个参数是请求成功回调函数，第三个函数是请求失败回调函数
    	stompClient.connect(headers, function(frame) {
    	    console.log("connected------------");
            stompClient.send("/myws/init",headers,"mjtest");
            stompClient.subscribe('/topic/init', function(message){
                var json = JSON.parse(message.body);
                alert(message);
                //console.log(message);
            });
        },function(error){
        	console.log(error);
        });
    });
</script>
</body>
</html>
