<script type="text/javascript">
Vue.component('my-file', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template:"#my-file-tp",
    computed : {
        ck:function (){
            var _this = this;
            var nr = "查看";
            var wjlx = null;
            var id = null;
            var sjlj = null;
            var astyle="";
            var istyle="width:100%;";
            if(_this.$root.listPage){
                var row = _this.$root.listPage.rows[_this.$parent.$parent.ri];
                wjlx = row.wjlx;
                id = row.id;
                sclj = row.sclj;
            }else{
                var editdata = _this.$root.$children["0"].editdata;
                wjlx = editdata.wjlx;
                id = editdata.id;
                sclj = editdata.sclj;
                astyle = "padding-top: 5px;position: absolute;";
            }
            if(wjlx=="png"||wjlx=="jpg"){
                nr = "<img style='"+istyle+"' src='common/download.do?xzms=false&id="+id+"'/>";
                astyle="";
            }else if(wjlx=="icon"){
                return sclj;
            }
            return "<a style='"+astyle+"' href='common/download.do?xzms=false&id="+id+"' target='_blank'>"+nr+"</a>";
        }
    },
    mounted: function () {
        var _this =  this;
        _this.target = this.$el;
        if(!_this.$root.listPage&&!_this.edit){
            $(_this.$el).removeAttr("class");
        }
        var field = this.field;
        if(this.edit){
            var kzxx = field.kzxx;
            if(typeof(kzxx) == "string"){
                eval("kzxx="+kzxx);
            }
            if(!kzxx.file){
                kzxx.file={
                        ywdm:"other",
                        wjlb:field.sjdx,
                        zdsc:true
                }
            }
            field.ajaxUpload = _this.ajaxUpload = new Ajax_upload(this.$el, {
                action : "common/upload.do",
        		data: {}, 
        		name : 'file',
        		autoSubmit : kzxx.file.zdsc!=false,
        		justClicked:false,
        		responseType : 'json',
        		onSubmit : function(file, ext) {
        			var type = ext[0];
        			//获取附加类型
        			if (!(type && /^(jpg|jpeg|gif|png|bmp|doc|docx|xlsx|xls|mp4|txt|zip|pptx|xmind)$/.test(type.toLowerCase()))) {
        				//alert("文件格式不正确，仅支持jpg,jpeg,gif,png,bmp,doc,docx,xlsx,xls,mp4,txt格式");
        			    alertInfo("该文件格式不支持上传");
        				return false;
        			}
        			var mydata = _this.ajaxUpload.mydata;
        			if(!mydata){
        			    mydata = kzxx.file;
        			}
        			this.setData(mydata);
        			// 上传中
            		this.disable();
        		},
        		onComplete : function(file, rep) {
        			this.enable();
        			if (rep.status ){
        			    if(_this.ajaxUpload.callback){
        			        _this.ajaxUpload.callback(file, rep.data);
        			    }else{
//                             alertInfo("上传成功");
            			    _this.$el.val = rep.data.id;
            			    _this.$el.file = file;
            			    _this.$el.rep = rep.data;
            			    _this.$emit('setval', _this.field, _this.$el);
        			    }
        			}else{
                        alertError("上传失败："+rep.msg);
        			}
        		}
        	});
        }
    }
  });
</script>

<script type="text/javascript">
Vue.component('my-inputn', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template: '#my-inputn-tp',
    methods : {
        setval : function($event) {
            if(!this.isDict||this.field.kjlx=='suggest'){
                var sf = strFunToFun(this.field.fgshff);
                if(sf){
                    $event.val=sf($event.target.value);
                }else{
                    $event.val = $event.target.value;
                }
                this.$emit('setval', this.field, $event);
            }
        }
	},
    computed : {
        nval:function (){
            var val=this.value;
            if(!this.edit&&this.isDict){
                val = zdMcByDmMore(this.field.zdzdlb,this.value);
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalTitle:function (){
            var val=this.value;
            if(!this.edit&&this.isDict){
                val = zdMcByDmMore(this.field.zdzdlb,this.value)+"["+this.value+"]";
            }
           return val;
        },
        isDict:function (){
           return this.field.kjlx=='dict'||this.field.kjlx=='checkbox'||this.field.kjlx=='suggest';
        }
    },
    mounted: function () {
        var _this =  this;
        _this.target = this.$el;
        var field = this.field;
        var kzxx = field.kzxx;
        if(typeof kzxx == "string"){
            eval("kzxx="+kzxx);
            field.kzxx = kzxx;
        }
        if(this.isDict&&this.edit){
            var zdObj = $(this.$el);
            var zdlb = field.zdzdlb;
            var otherParam = field.otherParam||'';
            var data = serviceAddr+"common/zdSearch.do?autoCount=true&zdlb="
                    +zdlb+"&otherParam="+otherParam;
            if(kzxx["字典数据"]){
                data = kzxx["字典数据"];
            }else if(!(this.field.zdfy=='1')&&zdlb!="SYS_COMMON_ORG"){
                var list = zdList(zdlb);
                if(list){
                	data = Object.values(list);
                }
            }
            var keyField = "dm";
            if(field.kjlx=='suggest'){
                keyField = "mc";
            }
            zdObj.selectPage({
            	data:data,
                showField: 'mc',
                keyField: keyField,
                searchField: "searchKey",
                orderBy : ['px asc','dm asc','mc'],
                eAjaxSuccess: function(d){
                    return d;
                },
                //选中项目后的回调处理
                //入参：data：选中行的原始数据对象
                eSelect : function(data){
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc=data.mc;
                    _this.$emit('setval', field,_this);
                    if(field.eSelect){
                    	field.eSelect(data,_this,field);
                    }
                },
				// 点击select的那个叉的事件回调
                eClear : function(){
                    _this.val="";
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eClear){
                    	field.eClear(_this,field);
                    }
                },
                eTagRemove: function(datas){
                    if(datas==0){
                        return;
                    }
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eTagRemove){
                    	field.eTagRemove(_this,field);
                    }
                },
                //格式化显示项目，提供源数据进行使用
                formatItem : function(data){
                	var formatItem = keyExist(kzxx,"字典控件.formatItem");
                	if(formatItem){
                	    return eval(formatItem+"(data)");
                	}else{
                	    return data.mc;
                	}
                },
                //仅选择模式，不允许输入查询关键字
                selectOnly : !(this.field.zdfy=='1'),
                //关闭分页栏，数据将会一次性在列表中展示，上限200个项目
                pagination : (this.field.zdfy=='1'),
                //关闭分页的状态下，列表显示的项目个数，其它的项目以滚动条滚动方式展现（默认10个）
                listSize : this.field.listSize|10,
                multiple : this.field.zddx=='1'
            });
            if(this.value){
                var data = {dm:this.value,mc:zdMcByDm(zdlb,this.value)};
                _this.val=data.dm;
                _this.mc=data.mc;
                if(field.eSelect){
                	field.eSelect(data,_this,field);
                }
            }
        }
      },
    updated: function () {
        if(this.isDict&&this.edit){
            var _this = this;
            $(this.$el).val(this.value);
            $("[name='"+(_this.owner||'')+_this.field.zddm+"']").val(this.value);
            $(this.$el).selectPageRefresh();
        }
      }
  });
</script>

    methods : {

            return "WdatePicker("+JSON.stringify(this.WdatePicker)+")";

            var gzstrs = hdyzgz.replace("；",';').split(";");

            }
        }
        eval("var kzxx="+this.field.kzxx);

<script type="text/javascript">
Vue.component('my-timeaera', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
          startData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          endData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          times:this.value||''
      }
    },
    template: '#my-timeaera-tp',
    created : function(){
        var times = this.times.split(";");
        var val1="";
        if(times[0]){
            val1=times[0];
            if(val1.indexOf('goDay:')==0){
                val1 = new Date().addDays(val1.substring(6)).format('yyyyMMddmmHHss');
            }
        }
        var val2="";
        if(times[1]){
            var val2=times[1];
            if(val2.indexOf('goDay:')==0){
                val2 = new Date().addDays(val2.substring(6)).format('yyyyMMddmmhhss');
            }
        }
        this.times = val1 + ";"+val2;
    },
    computed : {
        nvalStart:function (){
            var times = this.times.split(";");
            if(!times[0]){
                return "";
            }
            var val=times[0];
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalEnd:function (){
            var times = this.times.split(";");
            if(!times[1]){
                return "";
            }
            var val=times[1];
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        }
    },
    methods : {
        setvalStart : function($event) {
            var times = this.times.split(";");

        isInputn:function(){

            	||field.kjlx=='checkbox'||field.kjlx=='suggest'||field.kjlx=='textarea';
        },
        srkjClass:function(){
            //返回输入控件的class
            //如果是查询列表或（编辑列表且该字段不允许编辑）
            if(this.pagemodel=='cklist'||(this.pagemodel=='bjlist'&&(this.field.yxbj=='0'))){

            this.$emit('setval', field, event);

                if(sf){

        if(_this.fromid&&_this.isEdit){
            _this.$root.frommap[_this.fromid][(_this.owner||'')+_this.field.zddm]={
                    field:_this.field,

        if(_this.value&&this.pagemodel!='details'&&this.pagemodel!='cklist'){
            _this.val=_this.value;

});

				@click="expeAll"><i class="icon ion-ios-redo"></i> 导出全部</button>

	<!--分页渲染后放到这个元素中 -->
	<div :style="lbmsVal=='list'?'':'display: none;'"
		 class="row pagination width_100">

 </div>
</div>
</div>
</div>

<script type="text/javascript">
//导出excel按钮控件
Vue.component('my-zssjdx', {
    props: ['fromdata','sjdxid'],
    template:"#my-zssjdx-tp",
    data: function () {
        return {
            rows:[],
            listPage:new PageAjax(),
            listEditData:[],
            sjplscfield:{
                    kzxx:{
                        file:{
                            ywdm:"other",
                            wjlb:"other"
                        }
                    }
                },
                lbmsVal:null,
             lbmsfield:{
                "bjzs": "1",
                "gxsj": "20181219101612",
                "xzmrz": "list",
                "cjsj": "20181211224727",
                "kzxx": {},
                "id": "862C5DD21DFD4E03ABE18D5431A34369",
                "xzzs": "1",
                "zdlx": "VARCHAR2",
                "zdzdlb": "SYS_SJGL_LBMS",
                "sjdx": "SYS_SJGL_SJDX",
                "hdyzgz": "notNull;zd:SYS_SJGL_LBMS;",
                "zdcd": 8,
                "yxx": "1",
                "zddm": "my-lbms",
                "yxpx": "0",
                "zdqp": "YOUXIAOXING",
                "zdmc": "列表模式",
                "zdkd": 80,
                "cxbt": "0",
                "mbzs": "1",
                "cxzs": "1",
                "zdfy": "0",
                "zddx": "0",
                "lbzs": "0",
                "cxmrz": "1",
                "zdjp": "YXX",
                "yxbj": "1",
                "xqzs": "1",
                "kjlx": "dict",
                "px": 370,
                "bjbt": "1"
            }
        }
      },
      created : function(){
          var _this = this;
          this.$root.listPage = this.listPage;
          var data = this.$data;
   		  $.ajax({url : "sjdx/jcxx.do",
	        type : "post",
            async : false,
            data : {id:this.sjdxid},
            success:function(result){
    			if(result.status){
    			    var rd = result.data;
    			    _this.$root.sjdx = data.sjdx = rd.sjdx;
    			    _this.$root.fields = data.fields = rd.fields;
    			    _this.$root.user = data.user = rd.user;
    			    _this.$root.kzxx = data.kzxx = rd.kzxx;
    			    var lbymkz = rd.kzxx.lbymkz;
    			    if(lbymkz&&lbymkz["列表模式字典数据"]){
    			        data.lbmsfield.kzxx["字典数据"]=lbymkz["列表模式字典数据"];
    			    }
      			    _this.$root.frommap[_this.queryFromid]={};
      			    _this.$root.frommap[_this.listFromid]={};
    			}else{
    	        	redict(result);
    			}
   			}});
          data.action=this.action;
      	},
	      computed : {
	          dcpcl:function (){
	              var dcpcl = fromdata['my-dcpcl'];
	              if(!dcpcl&&this._data.kzxx.lbymkz){
	                  dcpcl = this._data.kzxx.lbymkz['my-dcpcl'];
	              }
	              return dcpcl||",操作,序号";
	          },
	             defaultLbms:function (){
		              var lbmsVal = fromdata['my-lbms'];
		              if(!lbmsVal&&this._data.kzxx.lbymkz){
		                  lbmsVal = this._data.kzxx.lbymkz['my-lbms'];
		              }
		              if(!lbmsVal){
		                  lbmsVal = "list";
		              }
		              return lbmsVal;
		          },
		          lbms:function(){
		              if(this.lbmsVal){
		                  return this.lbmsVal;
		              }else{
		                  return this.defaultLbms;
		              }
		          },
	          cxanmc:function (){
	              var anmc = fromdata['my-cxanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-cxanmc'];
	              }
	              return anmc;
	          },
	          xjanmc:function (){
	              var anmc = fromdata['my-xjanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-xjanmc'];
	              }
	              return anmc;
	          },
	          plscanmc:function (){
	              var anmc = fromdata['my-plscanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-plscanmc'];
	              }
	              return anmc;
	          },
	          lbkbj:function (){
	              var lbkbj = fromdata['my-lbkbj'];
	              if(!lbkbj&&this._data.kzxx.lbymkz){
	                  lbkbj = this._data.kzxx.lbymkz['my-lbkbj'];
	              }
	              return lbkbj;
	          },
	          fields : function (){ return this._data.fields;},
	          sjdx : function (){
					return this._data.sjdx;
				},
	          queryFromid : function (){ return "queryFromid-"+this.sjdx.id;},
	          listFromid : function (){ return "listFromid-"+this.sjdx.id;},
			  myFromStyle : function (){
			      var style = "";
			      var isCxtj = true;
	              if(fromdata['my-cxtj']!=undefined){
	                  isCxtj = fromdata['my-cxtj']!='0';
	              }else{
	                  isCxtj = this._data.sjdx.cxtj!='0';
	              }
	              if(!isCxtj||!this.qxByQxm("CXQX")){
	                  style+="display: none;";
	              }
	              return style;
				},
		      lbfields : function (){ return clone(this._data.fields);},
	          action:function (){ return "sjdx/page.do?dxdm="+this._data.sjdx.dxdm;},
	          lbls:function (){
	              var num=0;
	              var sfs = this.fields;
	              Object.keys(sfs).forEach(function(key){
	                  if(!(sfs[key].lbzs==false)){
	                      num++;
	                  }
	             });
	             return num;
	          },
		      bjmsUrl:function(){
		          var data = clone(fromdata);
		          data["my-lbkbj"] = "1";
	              return encodeURI(JSON.stringify(data));
		      },
		      pzzdUrl:function(){
	              return encodeURI(JSON.stringify({sjdx:this.sjdx.id,dxmc:this.sjdx.dxmc,'my-lbkbj':'1'}));
		      },
	          addUrl:function(){
	              return encodeURI(JSON.stringify({"sjdx":this.sjdx.id}));
	          },
	          pzdxUrl:function(){
	              return encodeURI(JSON.stringify({"id":this.sjdx.id}));
	          }
	      },
        methods : {
            zdcx:function(){
                var e = event || window.event || arguments.callee.caller.arguments[0];
                if(e && e.keyCode==13){ // enter 键
                    this.listPage.queryPage();
                }
            },
	          lbmsinfo:function(lbms){
	              var lbmszd = this.lbmsfield.kzxx["字典数据"];
	              for(var i in lbmszd){
	                  if(lbmszd[i].dm==lbms){
	                      return lbmszd[i];
	                  }
	              }
	          },
            plscTitle:function(){
            	layer.tips("请先下载模板，严格按照模板要求填充数据，数据验证要求与单个上报一致，只有全部数据验证通过才能上传成功",
            	        $(this.$el).find(".plscTitle"));
            },
	        plscmbTitle:function(){
            	layer.tips("请严格按照模板填充数据，注意模板中的提示信息",$(this.$el).find(".plscmbTitle"));
            },
            downloadTemplate:function(){
            	//下载模板
            	$.download("sjdx/getMb.do?dxdm="+this._data.sjdx.dxdm,{});
            },
	        expe:function(){
	            ExportExcel.saveAsExcel(this.$root.listPage,this.sjdx.dxmc+"-当前页",this.dcpcl);
	        },
	        expeAll:function(){
	            ExportExcel.exportAll(this.$root.listPage,this.sjdx.dxmc+"-全部",this.dcpcl);
	        },
	          qxByQxm : function (qxm){
					var user = this._data.user;
					return user.qxMap[user.map[this.sjdx.dxdm]+"_"+qxm];
				},
	          lbymkz:function (kznr){
	              var k = fromdata[kznr];
	              if(!k&&this._data.kzxx.lbymkz){
	                  k = this._data.kzxx.lbymkz[kznr];
	              }
	              return k;
	          },
	        fieldBt:function(field){
	            //判断是否必填
	            field.btzt = (this.lbkbj=='1'&&field.bjbt=='1');
	            field.lbkbj=(this.lbkbj=='1');
	            return field;
	        },
		    fval:function(row,field){
		        if(row[field.zddm]){
		            return row[field.zddm];
		        }else{
		            return field.xzmrz;
		        }
		    },
            setval:function(field,event){
                this.fromdata[field.zddm] = event.val;
                if(event.target.mc){
                    this.fromdata['map.'+field.zddm]=event.mc;
                }
                console.log(field.zdmc + "=" + this.fromdata[field.zddm]); 
             },
             lbmssetval:function(field,event){
                this.lbmsVal = event.val;
             },
             setvalTh:function(field,event){
                 var _this = this;
                 var ed = _this.listEditData;
                 for(var i=0;i<ed.length;i++){
                     event.ri=i;
                     _this.setvalList(field, event,_this);
                     _this.rows[i][field.zddm]=event.val;
                 }
             },
             setvalList:function(field,event,_this){
                 if(!_this){
                     _this = this;
                 }
                var r = event.ri;
                if(_this.listEditData[r][field.zddm]||_this.listPage.rows[r][field.zddm]!=event.val){
                    Vue.set(_this.listEditData[r],field.zddm,event.val);
                    if(field.zdywlb!='99'){
                        //非虚拟字段
                        Vue.set(_this.listEditData[r],'my-ybj',"1");
                    }
                    if(event.mc){
                        _this.listEditData[r]['map.'+field.zddm]=event.mc;
                    }
                    console.log(r+"-"+field.zdmc+ "=" + _this.listEditData[r][field.zddm]);
                }
              },
	        plcl:function(cllx,_this,options){
	            if(!_this){
		            _this = this;
	            }
	            if(!options){
	                options={};
	            }
                var ed = _this.listEditData;
                var ids = "";
                for(var i=0;i<ed.length;i++){
					if(ed[i]['my-lbxz']=='1'){
					    ids=ids+","+ed[i][_this.sjdx.zjzd];
					}
                }
                if(ids==""&&!(options.bxlbh==false)){
                    alertError("请选择要操作行");
                    return;
                }
                options.id=_this.sjdx.id;
                options['e_cllx']=cllx;
                options['e_ids']=ids.substring(1);
            	var loadindex = layer.load(0,{
            		shade: [0.3]
            	});
	            ajax('sjdx/plcl.do',{
	                fromdata:options,
	                qrts:options.qrts,
	                success:function(data){
		                alertInfoYes(data,function(){
	        	   		 	_this.listPage.queryPage(); //执行页面刷新函数 
						});
		                layer.close(loadindex);
	                }
	            });
	        },
            sjplsc:function(field,e){
                this.plcl("sjplsc",null,{"e_file":JSON.stringify(e.rep),"bxlbh":false,"qrts":false});
            },
              saveListData:function(){
                  var _this = this;
                  fromdata.id=_this._data.sjdx.id;
                  if(!myValidFrom(_this,'saveList')){
                      return;
                  }
                  fromdata.myparams = JSON.stringify({"listEditData":_this.listEditData});
	              qrtsAjax("sjdx/saveListData.do",fromdata,function(data){
            	   	alertInfoYes(data,function(){
	    			    _this.listPage.refreshPage();
					});
	              });
              },
              reloadTree:function(){
                  var _this = this;
                  var zTree = $.fn.zTree.getZTreeObj('leftTree-'+_this.sjdx.id),
					type = "refresh",
					silent = false,
					nodes = zTree.getSelectedNodes();
					if (nodes.length == 0) {
						alertInfo("请先选择一个父节点");
					}
					for (var i=0, l=nodes.length; i<l; i++) {
						zTree.reAsyncChildNodes(nodes[i], type, silent);
						if (!silent) zTree.selectNode(nodes[i]);
					}
              },
              initTree:function(){
                    var _this = this;
		            if(!_this.lbymkz("my-istree")){
		                return;
		            }
		            var fjd = "fjd";
		            if(_this.lbymkz("fjdzddm")){
		                fjd = _this.lbymkz("fjdzddm");
		            }
                  	var setting = {
              			data: {
              				simpleData: {
              					enable: true
              				}
              			},
              			view:{
          				    fontCss: setNode,
              			    showLine:true,
              			    showIcon:true,
              			    nameIsHTML:true
              			},
              			async: {
              				enable: true,
              				url:"sjdx/getdata.do?dxdm="+_this.sjdx.dxdm,
              				autoParam:["dm=e_"+fjd],
              				otherParam:{"e_cllx":"getTreeCN"},
              				dataFilter: treefilter
              			},
              			callback: {
              				onClick: treeClick
              			}
              		};
					//树节点的单击事件
	          		function treeClick(event, treeId, treeNode, clickFlag) {
					    Vue.set(_this.fromdata,fjd,treeNode.dm);
	          		}
	          		//处理后台返回的数据
	          		function treefilter(treeId, parentNode, rep) {
	          			if (!rep.status) return null;
	          			var list = rep.data.list;
	          			for (var i=0, l=list.length; i<l; i++) {
	          				list[i].isParent=(list[i].parent>0)
	          			}
	          			return list;
	          		}
	          		//节点展示前的处理
	                function setNode(treeId, node) {
	                    if(node.myIcon){
	                        node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
	                    }
	                    if(node.icon){
	                        node.icon="common/download.do?id="+node.icon;
	                    }
	          			return {};
	          		}
		            $.fn.zTree.init($('#leftTree-'+_this.sjdx.id), setting);
              }
        },
        mounted: function () {
            var _this = this;
            this.listPage.setPageId("#"+this.$el.id);
            this.listPage.paramType = "jsonStr";
            this.listPage.listFrom = _this;
            this.listPage.exportUrl = "sjdx/export.do?dxdm="+_this.sjdx.dxdm;
            this.listPage.fytjxs = _this.sjdx.fytjxs;
            if(typeof(initPage)=='function'){
                initPage(this.listPage);
            }
            this.listPage.callback = function(data){
                var rows = data.list;
                _this.listEditData = [];
                for(var i=0;i<rows.length;i++){
   	              var p = {};
 	              p[_this.sjdx.zjzd]=rows[i][_this.sjdx.zjzd];
                  _this.listEditData.push(p);
                  rows[i]['my-lbxz']='0';
                }
            }
            if(!(_this.sjdx.cscx=='0')){
                this.listPage.queryPage();
            }
            //初始化左侧树
            _this.initTree();
        }
  });
</script>

	        <button v-if="qxByQxm('PZDX')" class="btn btn-primary btn-sm" :href="'sjdx/edit.do?pagemodel=edit&dxdm=SYS_SJGL_SJDX&myparams='+pzdxUrl"
	            a-oper="other"><i class="icon ion-gear-b"></i> 配置对象</button>
	        <button v-if="qxByQxm('PZZD')" class="btn btn-primary btn-sm" :href="'sjdx/list.do?dxdm=SYS_SJGL_SJZD&myparams='+pzzdUrl"
	            a-oper="newTab"><i class="icon ion-levels"></i> 配置字段</button>
			<slot></slot>
        </div>
        <div class="btn-table-right">
			<button v-if="qxByQxm('DCDQY')" class="btn btn-default btn-sm" type="button"
				@click="expe"><i class="icon ion-ios-redo-outline"></i> 导出当前页</button>
			<button v-if="qxByQxm('DCQB')" class="btn btn-default btn-sm" type="button"
				@click="expeAll"><i class="icon ion-ios-redo"></i> 导出全部</button>
    	</div>
	</div>
	<div class="panel-body exportDiv" style="overflow: auto;">
	    <table class="table table-striped table-bordered table-hover">
	        <thead>
	            <tr class="listHard">
	                <th is="my-th" v-for="(field,key,index) in lbfields" 
						:field="fieldBt(field)" @setvalTh="setvalTh"></th>
	            </tr>
	        </thead>
	        <tbody class="listContent">
		        <tr v-for="(row,ri) in rows" :class="'listrow '">
	                <td is="my-td"  v-for="(field,key,index) in lbfields"
	                	:key="'led'+ri+field.zddm" 
	                	:id="'led'+ri+field.zddm" 
						:fromid="listFromid"
	                	:field="field" :ri="ri" :index="index"
	                	:row="row" :pagemodel="lbkbj=='1'?'bjlist':'cklist'"
	                	:owner="'led.'+ri+'.'" 
						:value="fval(row,field)"

	<div class="row pagination width_100">

 </div>

<script type="text/javascript">

		        if(row[field.zddm]){

		        }else{
		            return field.xzmrz;

		    },
            setval:function(field,event){

             },

             },
             setvalTh:function(field,event){
                 var _this = this;
                 var ed = _this.listEditData;
                 for(var i=0;i<ed.length;i++){
                     event.ri=i;
                     _this.setvalList(field, event,_this);
                     _this.rows[i][field.zddm]=event.val;

             },
             setvalList:function(field,event,_this){
                 if(!_this){
                     _this = this;
                 }
                var r = event.ri;
                if(_this.listEditData[r][field.zddm]||_this.listPage.rows[r][field.zddm]!=event.val){

	            if(!options){

                var ed = _this.listEditData;
                var ids = "";
                for(var i=0;i<ed.length;i++){
					if(ed[i]['my-lbxz']=='1'){
					    ids=ids+","+ed[i][_this.sjdx.zjzd];
					}

                if(ids==""&&!(options.bxlbh==false)){
                    alertError("请选择要操作行");
                    return;
                }
                options.id=_this.sjdx.id;
                options['e_cllx']=cllx;
                options['e_ids']=ids.substring(1);
            	var loadindex = layer.load(0,{

					nodes = zTree.getSelectedNodes();

					for (var i=0, l=nodes.length; i<l; i++) {

						if (!silent) zTree.selectNode(nodes[i]);
					}
              },
              initTree:function(){
                    var _this = this;
		            if(!_this.lbymkz("my-istree")){
		                return;
		            }
		            var fjd = "fjd";
		            if(_this.lbymkz("fjdzddm")){
		                fjd = _this.lbymkz("fjdzddm");
		            }
                  	var setting = {
              			data: {
              				simpleData: {
              					enable: true
              				}
              			},
              			view:{
          				    fontCss: setNode,
              			    showLine:true,
              			    showIcon:true,
              			    nameIsHTML:true
              			},

              				enable: true,
              				url:"sjdx/getdata.do?dxdm="+_this.sjdx.dxdm,

              				dataFilter: treefilter

              			callback: {
              				onClick: treeClick
              			}
              		};
					//树节点的单击事件
	          		function treeClick(event, treeId, treeNode, clickFlag) {
					    Vue.set(_this.fromdata,fjd,treeNode.dm);
	          		}
	          		//处理后台返回的数据
	          		function treefilter(treeId, parentNode, rep) {
	          			if (!rep.status) return null;
	          			var list = rep.data.list;
	          			for (var i=0, l=list.length; i<l; i++) {
	          				list[i].isParent=(list[i].parent>0)
	          			}
	          			return list;
	          		}
	          		//节点展示前的处理
	                function setNode(treeId, node) {
	                    if(node.myIcon){
	                        node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
	                    }
	                    if(node.icon){
	                        node.icon="common/download.do?id="+node.icon;
	                    }
	          			return {};
	          		}
		            $.fn.zTree.init($('#leftTree-'+_this.sjdx.id), setting);
              }
        },
        mounted: function () {
            var _this = this;
            this.listPage.setPageId("#"+this.$el.id);
            this.listPage.paramType = "jsonStr";
            this.listPage.listFrom = _this;
            this.listPage.exportUrl = "sjdx/export.do?dxdm="+_this.sjdx.dxdm;

            if(!(_this.sjdx.cscx=='0')){
                this.listPage.queryPage();

            //初始化左侧树
            _this.initTree();

        var _this = this;

 		$.ajax({url : "sjdx/jcxx.do",

          async : false,

  			    _this.updatedata[zjzd]=zj;
  			    _this.editdata = rd.obj;

          });
 		data.action = this.action;
 		data.index = this.index;
    },
    computed : {
        fields : function (){ return this._data.fields},
        sjdx : function (){ return this._data.sjdx },
        action : function (){ return 'sjdx/save.do?id='+this.sjdxid },
        mydqan : function(){
			return this.bjymkz('my-qdan');
        },
        index : function (){
            if(this.fromdata['my-bjxh']!=undefined){
                return this.fromdata['my-bjxh']!='0';

                return this.sjdx.bjxh!='0';
            }
        },
        fromid:function(){
            return this.$root.$options.el;
        }

    methods : {
          setval:function(field,event){
              if(this.pagemodel=='edit'&&this.editdata[field.zddm]==event.val){
                  return;
              }
              this.updatedata[field.zddm] = event.val;
              if(event.mc){
                  this.updatedata['map.'+field.zddm]=event.mc;
              }
              console.log(field.zdmc + "=" + this.updatedata[field.zddm]); 
           },

	                  k = this._data.kzxx.bjymkz[kznr];
	              }
	              return k;

 	            	   	    _this.editdata=$.extend({},_this.editdata,result.data);
 	            	   	    if(success){
 	            	   	        success(data);
 	            	   	    }
 						});
 		            });
	        },
           submit:function(){
               var _this = this;
               if(this.fromdata.submitBefore){
                   if(!this.fromdata.submitBefore(_this)){
                       return false;
                   }
               }
               if(!myValidFrom(_this)){
                   return;
               }else if(!$(_this.fromid).isValid()){
                   return;
               }else{
                   if(Object.keys(_this._data.updatedata).length==1){
	    	           alertInfo("你没有修改任何数据项");
                       return;
                   }
                   if(typeof(sjdxZdyjy)=='function'){
                       //自定义校验
                       if(!sjdxZdyjy(_this._data.updatedata,_this)){
                           return;
                       }
                   }
                   var _params = {myparams:JSON.stringify(Object.assign({},this.fromdata, _this._data.updatedata))};
                   if(_this.bjymkz("my-qdbts")=='1'){
                       myAjax(_this.action,_params,function(data){
                           if(_this.fromdata.qdzdyFun){
                               _this.fromdata.qdzdyFun(data);

	    	            	   	alertInfoYes(data,function(){

                   }else{
     	               qrtsAjax(_this.action,_params,function(data){
                           if(_this.fromdata.qdzdyFun){
                               _this.fromdata.qdzdyFun(data);
                           }else{
	    	            	   	alertInfoYes(data,function(){

	    	        	   			parent.layer.close(index);
	    						});
                           }
    		            });
                   }
               }
           }
	},
    mounted: function () {
    }
  });
</script>

<script type="text/javascript">
Vue.component('my-cdym', {
    props: ['fromdata','sjdxid','pagemodel'],
    template:"#my-cdym-tp",
    data: function () {
      return {
          openCd:[],
          showCd:""
      }
    },
    created : function(){
        var _this = this;
        var data = _this._data;
        var params = {id:_this.sjdxid};
        params.myparams = JSON.stringify(fromdata);
 		$.ajax({url : "sjdx/jcxx.do",
	      type : "post",
          async : false,
          data : params,
          success:function(result){
  			if(result.status){
  			    var rd = result.data;
			    _this.$root.sjdx = data.sjdx = rd.sjdx;
			    _this.kzxx = rd.kzxx;
  			    _this.user = rd.user;
  		        $("head > title").text(rd.kzxx['菜单信息']['系统名称']);
  			}else{
	        	redict(result);
  			  }
 			}
          });
    },
    computed : {
        dlfromdata:function(){
            this.fromdata.qdzdyFun=function(result){
            	alertInfo(result.data.yhxm+":"+result.msg);
            }
            return this.fromdata;
        }
    },
    methods : {
        centerLoading:function(){
            this.centerLoadingId = layer.load(0,{
        		shade: [0.3]
        	});
        },
        cdRightStyle:function(dm){
            var style = "width: 100%;height: 100%;overflow: scroll;border: snow;";
            if(dm!=this.showCd){
                style+="display: none;";
            }
            return style;
        },
        tuichu:function(){
            window.location.href="sjdx/edit.do?pagemodel=add&dxdm="+this.kzxx['菜单信息']['登陆对象'];
        },
        fileUrl:function(key){
            if(this.kzxx['菜单信息'][key]){
                return 'common/download.do?id='+this.kzxx['菜单信息'][key];
            }else{
                return "";
            }
        },
        centerLoad:function(){
            layer.close(this.centerLoadingId);
        },
        initTree:function(){
            var _this = this;
        	var setting = {
        		data: {
        			simpleData: {
        				enable: true
        			}
        		},
        		view:{
        			fontCss: setNode,
        			showLine:true,
        			showIcon:true,
        			nameIsHTML:true
        		},
        		async: {
        			enable: true,
        			url:"sjdx/getdata.do?dxdm=SYS_QX_QTQX",
        			autoParam:["dm=e_fjd"],
        			otherParam:{"e_cllx":"getTreeCN",
        			    //树模式=菜单树
        			    "e_treeModel":'cds',
        			    //菜单树根节点
        			    "e_treeRoot":this.kzxx['菜单信息']['菜单根节点']},
        			dataFilter: treefilter
        		},
        		callback: {
        			onClick: treeClick
        		}
        	};
        	//树节点的单击事件
        	function treeClick(event, treeId, treeNode, clickFlag) {
        	    var mbdz = null;
        		if(treeNode.lx=='02'){
        			console.info('这是目录');
        		}else if(treeNode.dzlx=='02'){
        			//绝对地址
        		    mbdz = treeNode.dz;
        		}else if(treeNode.dzlx=='03'){
        			//数据对象
        			mbdz = "sjdx.do?dxdm="+treeNode.dz;
        		}else if(treeNode.dzlx=='04'){
        			//数据对象列表
        			mbdz = "sjdx/list.do?dxdm="+treeNode.dz;
        		}else{
        			alert('暂未实现');
        		}
        		if(mbdz!=null){
					if(mbdz.indexOf("?")==-1){
					    mbdz += "?";
					}else{
					    mbdz += "&";
					}
        		    //添加权限编码
				    mbdz += "authCode="+treeNode.dm;
        		    if(treeNode.dkfs=='01'){
        		        if($(_this.$el).find(".gnIframe."+treeNode.id).length==0){
        		            _this.centerLoading();
        		            _this.openCd.push({id:treeNode.id,src:mbdz});
        		        }else if(_this.showCd == treeNode.id){
        		            _this.centerLoading();
        		            $(_this.$el).find(".gnIframe."+treeNode.id).attr("src",mbdz);
        		        }
    		            _this.showCd = treeNode.id;
        		    }else if(treeNode.dkfs=='02'){
            			window.open(mbdz);
        		    }else if(treeNode.dkfs=='03'){
        		        var perContent  = layer.open({
      				      type: 2,
      				      title: treeNode.mc,
      				      shadeClose: true,
      				      shade: false,
      				      maxmin: true, //开启最大化最小化按钮
      				      area: ['800px', '500px'],
      				      content: mbdz
			      		});
			            layer.full(perContent);
        		    }
        		}
        	}
        	//处理后台返回的数据
        	function treefilter(treeId, parentNode, rep) {
        		if (!rep.status) return null;
        		var list = rep.data.list;
        		var cdList = [];
        		for (var i=0, l=list.length; i<l; i++) {
       				list[i].isParent=(list[i].parent>0);
       				cdList.push(list[i]);
        		}
        		return cdList;
        	}
        	//节点展示前的处理
        	function setNode(treeId, node) {
        		if(node.myIcon){
        			node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
        		}
        		if(node.icon){
        			node.icon="common/download.do?id="+node.icon;
        		}
        		return {};
        	}
        	$.fn.zTree.init($('#leftTree-'+this.sjdxid), setting);
        }
	},
	mounted:function(){
        this.initTree();
	}
  });
</script>
