<script type="text/javascript">
Vue.component('my-inputn', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template: '#my-inputn-tp',
    methods : {
        setval : function($event) {
            if(this.field.kjlx!='dict'){
                var sf = strFunToFun(this.field.fgshff);
                if(sf){
                    $event.val=sf($event.target.value);
                }else{
                    $event.val = $event.target.value;
                }
                this.$emit('setval', this.field, $event);
            }
        }
	},
    computed : {
        nval:function (){
            var val=this.value;
            if(!this.edit&&this.field.kjlx=='dict'){
                val = zdMcByDmMore(this.field.zdzdlb,this.value);
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalTitle:function (){
            var val=this.value;
            if(!this.edit&&this.field.kjlx=='dict'){
                val = zdMcByDmMore(this.field.zdzdlb,this.value)+"["+this.value+"]";
            }
           return val;
        }
    },
    mounted: function () {
        var _this =  this;
        _this.target = this.$el;
        var field = this.field;
        if(this.field.kjlx=='dict'&&this.edit){
            var zdObj = $(this.$el);
            var zdlb = field.zdzdlb;
            var otherParam = field.otherParam||'';
            var data = serviceAddr+"common/dict/zdSearch.do?autoCount=true&map%5B'zdlb'%5D="
                    +zdlb+"&map%5B'otherParam'%5D="+otherParam;
            if(!(this.field.zdfy=='1')&&zdlb!="SYS_COMMON_ORG"){
            	data = zdList(zdlb);
            }
            zdObj.selectPage({
            	data:data,
                showField: 'mc',
                keyField: 'dm',
                searchField: "map%5B'searchKey'%5D",
                orderBy : ['px asc','dm asc','mc'],
                eAjaxSuccess: function(d){
                    for(var i in d.list){
                        d.list[i].mc=d.list[i].mc+"["+d.list[i].dm+"]";
                    }
                    return d;
                },
                //选中项目后的回调处理
                //入参：data：选中行的原始数据对象
                eSelect : function(data){
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc=data.mc;
                    _this.$emit('setval', field,_this);
                    if(field.eSelect){
                    	field.eSelect(data,_this,field);
                    }
                },
				// 点击select的那个叉的事件回调
                eClear : function(){
                    _this.val="";
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eClear){
                    	field.eClear(_this,field);
                    }
                },
                eTagRemove: function(datas){
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eTagRemove){
                    	field.eTagRemove(_this,field);
                    }
                },
                //仅选择模式，不允许输入查询关键字
                selectOnly : !(this.field.zdfy=='1'),
                //关闭分页栏，数据将会一次性在列表中展示，上限200个项目
                pagination : (this.field.zdfy=='1'),
                //关闭分页的状态下，列表显示的项目个数，其它的项目以滚动条滚动方式展现（默认10个）
                listSize : this.field.listSize|10,
                multiple : this.field.zddx=='1'
            });
            if(this.value){
                var data = {dm:this.value,mc:zdMcByDm(zdlb,this.value)};
                _this.val=data.dm;
                _this.mc=data.mc;
                if(field.eSelect){
                	field.eSelect(data,_this,field);
                }
            }
        }
      },
    updated: function () {
        if(this.field.kjlx=='dict'){
            $(this.$el).selectPageRefresh();
        }
      }
  });
</script>

<script type="text/javascript">
Vue.component('my-time', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template: '#my-time-tp',
    methods : {
        setval : function($event) {
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                $event.val=sf($event.target.value,this);
            }else{
                $event.val = $event.target.value;
            }
            this.$emit('setval', this.field, $event);
        }
	},
    computed : {
        nval:function (){
            var val=this.value;
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
            return val;
        },
        nvalTitle:function (){
            var val=this.value;
            return val;
        },
        onfocus:function (){
            return "WdatePicker("+JSON.stringify(this.dateFmt)+")";
        },
        dateFmt:function (){
            var hdgs = "yyyyMMddHHmmss";
            var hdyzgz = this.field.hdyzgz;
            if(hdyzgz){
                var gzstrs = hdyzgz.replace("；",';').split(";");
                for(idx in gzstrs){
                    var gzs = gzstrs[idx].split(":");
                    if(gzs[0]=='date'){
                        if(gzs[1]){
                            hdgs = gzs[1];
                        }
                        break;
                    }
                }
            }
            var dateFmt = 'yyyy-MM-dd';
            var maxDate = '%y-%M-%d';
            if(this.pagemodel!='search'){
                dateFmt = "yyyy-MM-dd HH:mm:ss";
                maxDate = "%y-%M-%d %H:%m:%s";
            }
            return {dateFmt:dateFmt,readOnly:true,maxDate:maxDate,hdgs:hdgs};
        }
    }
  });
</script>

<script type="text/javascript">
Vue.component('my-timeaera', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
          startData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          endData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          times:this.value||''
      }
    },
    template: '#my-timeaera-tp',
    computed : {
        nvalStart:function (){
            var times = this.times.split(";");
            if(!times[0]){
                return "";
            }
            var val=times[0];
            if(val.indexOf('goDay:')==0){
                val = new Date().addDays(val.substring(6)).format('yyyyMMddmmhhss');
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalEnd:function (){
            var times = this.times.split(";");
            if(!times[1]){
                return "";
            }
            var val=times[1];
            if(val.indexOf('goDay:')==0){
                val = new Date().addDays(val.substring(6)).format('yyyyMMddmmhhss');
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        }
    },
    methods : {
        setvalStart : function($event) {
            var times = this.times.split(";");
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                times[0]=sf($event.target.value,this,$event);
            }else{
                times[0] = $event.target.value;
            }
            $event.val=times;
            this.$emit('setval', this.field, $event);
        },
	    setvalEnd : function($event) {
            var times = this.times.split(";");
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                times[1]=sf($event.target.value,this,$event);
            }else{
                times[1] = $event.target.value;
            }
            $event.val=times;
	        this.$emit('setval', this.field, $event);
	    },
	    wpStart:function(){
	        WdatePicker(this.startData);
	    },
	    wpEnd:function(){
	        WdatePicker(this.endData);
	    }
 	}
  });
</script>

<script type="text/javascript">
Vue.component('my-srkj', {
    props : [ 'field', 'index', 'value', 'data','pagemodel','fieldshow','owner' ],
    data : function() {
        return {}
    },
    computed : {
        isEdit:function(){
            var pagemodel = this.pagemodel;
            return ((pagemodel=='bjlist'||pagemodel=='edit')&&!(this.field.yxbj=='0'))
            	||pagemodel=='add'||pagemodel=='search';
        },
        srkjClass:function(){
            //返回输入控件的class
            //如果是查询列表或（编辑列表且该字段不允许编辑）
            if(this.pagemodel=='cklist'||(this.pagemodel=='bjlist'&&(this.field.yxbj=='0'))){
                return "";
            }else{
                return "form-control";
            }
        }
    },
    template : '#my-srkj-tp',
    methods : {
        setval : function(field,event) {
            this.$emit('setval', field, event);
        }
    },
    created : function() {
//         console.log('初始化字段: ' + this.index + ":" 
//                 + this.field.zddm + "=" + this.value);
    },
    mounted: function () {
        var _this =  this;
        var field = this.field;
        //默认值不为空且非详情页面
        if(_this.value&&this.pagemodel!='details'&&this.pagemodel!='cklist'){
            _this.val=_this.value;
            _this.target = _this;
            _this.$emit('setval', field,_this);
        }
    }
});

<script type="text/javascript">
Vue.component('my-from', {
    props : [ 'data', 'fromdata','pagemodel' ],
    data : function() {
        return {}
    },
    template : '#my-from-tp',
    created : function() {
        console.log('字段数量: ' + Object.keys(this.data.fields).length);
    },
    computed : {
        
    },
    methods : {
        setval : function(field,event) {
            this.$emit('setval', field, event);
        },
	    fieldshow:function (field){
	        var pagemodel = this.pagemodel;
	        return ((pagemodel=='add'&&!(field.xzzs=='0'))
	                ||(pagemodel=='edit'&&!(field.bjzs=='0'))
	                ||(pagemodel=='search'&&!(field.cxzs=='0'))
	                ||(pagemodel=='details'&&!(field.xqzs=='0')));
	    },
	    fval:function(field){
	        //获取字段值
	        var pagemodel = this.pagemodel;
	        var fromdata = this.fromdata;
	        if(fromdata[field.zddm]){
	            //存在传入的值
	            return fromdata[field.zddm];
	        }else if(pagemodel=='search'){
	            //查询模式，显示查询默认值
	            return field.cxmrz;
	        }else{
	            //其他模式，显示新增默认值
	            return field.xzmrz;
	        }
	    }
    }
});
</script>

<script type="text/javascript">
Vue.component('my-th', {
    props: ['field'],
    template:"#my-th-tp",
    data: function () {
      return {
          val:''
      }
    },
    computed : {
        isCheckBox:function(){
            var field = this.field;
            return (field.kjlx=='checkbox'&&field.lbkbj)||(field.zddm=='my-lbxz');
        },
        thName:function(){
            var field = this.field;
            return (field.zddm=='my-lbxz'?'':field.zdmc);
        }
    },

//vue常用方法
/**
 * 时间格式化
 */
function vueTimeGsh(value,_this){
    if(_this.pagemodel=='search'){
        //查询模式，将时间转为精确到天，一般查询不用精确到时分秒，需要的特殊情况请自定义方法。
        return time14Totime10(value);
    }
    var val = time14Totime19(value);
    if(_this.pagemodel=='details'||_this.pagemodel=='cklist'){
        return "<span style='color:red;'>"+val+"<span>";
    }else{
        return val;
    }
}

        return time10Totime8(value);
    }
    return time19Totime14(value);
}
