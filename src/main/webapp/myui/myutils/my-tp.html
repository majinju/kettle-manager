<script type="text/javascript">
Vue.component('my-yjcd', {
    props: ['rows','show','x','y'],
    data: function () {
      return {
          tshow:show
      }
    },
    template:"#my-yjcd-tp",
    computed : {
        isShow:function (){
           return tshow;
        }
    },
    methods : {
        showRMenu:function(type, x, y) {
            y += document.body.scrollTop;
            x += document.body.scrollLeft;
            rMenu.css({"top":y+"px", "left":x+"px", "visibility":"visible"});
        },
        hideRMenu:function() {
            if (rMenu) rMenu.css({"visibility": "hidden"});
            $("body").unbind("mousedown", onBodyMouseDown);
        },
        onBodyMouseDown:function(event){
            if (!(event.target.id == "rMenu" || $(event.target).parents("#rMenu").length>0)) {
                rMenu.css({"visibility" : "hidden"});
            }
        },
        rowClick:function(row){
            //右键菜单单击事件
            this.$emit('rowClick', row,this);
        }
    },
    created : function(){
        var _this =  this;
    },
    mounted: function () {
        var _this =  this;
    },
    watch: {
      show: function () {
          this.tshow=show;
          $("body").bind("mousedown", onBodyMouseDown);
      }
    }
  });
</script>

<script type="text/javascript">
Vue.component('my-file', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
          kzxxObj:{},
          val:""
      }
    },
    template:"#my-file-tp",
    computed : {
        ck:function (){
            var _this = this;
            var val=this.value;
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
            if(val==""){
                return "无文件";
            }
            var nr = null;
            var url = getDownloadUrl()+"?xzms=false&id="+val;
            var astyle="";
            var istyle="width:100%;max-height:200px;";
            var filePz = this.kzxxObj.file;
            if(filePz.zsxs=="jpg"||filePz.zsxs=="jpeg"||filePz.zsxs=="gif"||filePz.zsxs=="png"||filePz.zsxs=="bmp"){
                //jpg|jpeg|gif|png|bmp
            }else if(filePz.zsxs=="url"){
                url = val;
            }else if(filePz.zsxs=="base64"){
                url = "data:image/png;base64,"+val;
            }else if(filePz.zsxs=="basicUrl"){
                url = filePz.basicUrl+val;
            }else if(filePz.zsxs=="icon"){
                return val;
            }else{
                nr = "查看";
            }
            if(nr!='查看'){
                nr = "<img style='"+istyle+"' src='"+url+"'/>";
            }
            return "<a style='"+astyle+"' href='"+url+"' target='_blank'>"+nr+"</a>";
        }
    },
    created : function(){
        var _this =  this;
        _this.target = this.$el;
        var field = this.field;
        var kzxx = field.kzxx;
        if(typeof(kzxx) == "string"){
            eval("kzxx="+kzxx);
        }
        if(!kzxx.file){
            kzxx.file={}
        }
        kzxx.file = $.extend( {
            ywdm:"other",
            wjlb:field.sjdx,
            zdsc:true,
            qcwj:'1',
            wjlx:"jpg|jpeg|gif|png|bmp|doc|docx|xlsx|xls|mp4|txt|zip|7z|rar|pdf|pptx|xmind"
    	},kzxx.file);
        _this.kzxxObj = kzxx;
    },
    methods : {
        qcwj : function() {
            var _this =  this;
            if(_this.val == ""){
    		    alertInfo("无文件需要清除");
            }else{
    		    _this.val = "";
    		    _this._data.val="";
    		    _this.target = _this.$el;
    		    _this.$emit('setval', _this.field, _this);
    		    alertInfo("已清除文件，点击确定进行保存后才能生效");
            }
        }
    },
    mounted: function () {
        var _this =  this;
        _this.target = this.$el;
        var field = this.field;
        var kzxx = this.kzxxObj;
        if(this.edit){
            var _btn = $(this.$el).find("button")[0];
            if(!_btn){
                _btn = this.$el;
            }
            field.ajaxUpload = _this.ajaxUpload = new Ajax_upload(_btn, {
                action : serviceAddr+"common/upload.do",
        		data: {}, 
        		name : 'file',
        		autoSubmit : kzxx.file.zdsc!=false,
        		justClicked:false,
        		responseType : 'json',
        		onSubmit : function(file, ext) {
        			var type = ext[0];
                    eval("var bds = /^("+kzxx.file.wjlx+")$/");
        			//获取附加类型
        			if (!(type && bds.test(type.toLowerCase()))) {
        				//alert("文件格式不正确，仅支持jpg,jpeg,gif,png,bmp,doc,docx,xlsx,xls,mp4,txt格式");
        			    alertInfo("该文件格式不支持上传");
        				return false;
        			}
        			var mydata = _this.ajaxUpload.mydata;
        			if(!mydata){
        			    mydata = kzxx.file;
        			}
        			this.setData(mydata);
        			// 上传中
            		this.disable();
        		},
        		onComplete : function(file, rep) {
        			this.enable();
        			if (rep.status ){
        			    if(_this.ajaxUpload.callback){
        			        _this.ajaxUpload.callback(file, rep.data);
        			    }else{
//                             alertInfo("上传成功");
            			    _this.val = rep.data.id;
                            _this._data.val=_this.val;
            			    _this.file = file;
            			    _this.rep = rep.data;
            			    _this.target = _this.$el;
            			    _this.$emit('setval', _this.field, _this);
        			    }
        			}else{
                        alertError("上传失败："+rep.msg);
        			}
        		}
        	});
        }
    }
  });
</script>

                $event.val = this.checked;

 	}

                eAjaxSuccess: function(d){

            if(field.kzxxObj&&field.kzxxObj.hasOwnProperty("kjlx."+pagemodel)){
                return field.kzxxObj["kjlx."+pagemodel];
            }
            if((field.kjlx=='checkbox'&&(pagemodel=='cklist'||pagemodel=='bjlist'))
                ||(field.kjlx=='jsoneditor'&&(pagemodel=='edit'||pagemodel=='add'||pagemodel=='details'))
                ||(field.kjlx=='markdown'&&(pagemodel=='edit'||pagemodel=='add'||pagemodel=='details'))
                ||(field.kjlx=='textarea'&&pagemodel!='search'&&pagemodel!='cklist')
                ||(field.kjlx=='time'&&pagemodel!='search')
                ||(field.kjlx=='number'&&pagemodel!='search')
                ||(field.kjlx=='password')
                ||(field.kjlx=='file')){
                return kjlx;

                return "timearea";
            }else if(field.kjlx=='numberarea'||(field.kjlx=='number'&&pagemodel=='search')){

                return "input";

        srkjClass:function(){
            //返回输入控件的class
            //如果是查询列表或（编辑列表且该字段不允许编辑）
            if(this.pagemodel=='cklist'||(this.pagemodel=='bjlist'&&(this.field.yxbj=='0'))

            }else{

        setval : function(field,event) {

            this.$emit('setval', field, event);
            if(field.kjlx!='number'&&zdyyzgz(field, event.val,this)&&field.szhd){
                //设值回调方法
                var sf = strFunToFun(this.field.szhd);
                if(sf){

            this.val=event.val;

        if(_this.fromid&&_this.isEdit){
            _this.$root.frommap[_this.fromid][(_this.owner||'')+_this.field.zddm]={
                    field:_this.field,
                    srkj:_this

        }
        //默认值不为空且非详情页面
        if(_this.value&&!_this.val&&this.pagemodel!='details'&&this.pagemodel!='cklist'){
            _this.val=_this.value;
            _this.target = _this;
            _this.$emit('setval', field,_this);

    }

});

            if(this.field.yxpx!='1'){
                return;
            }
            var el = $(this.$el);
            var fi = el.find("i");
            var ficlass = fi.attr("class");
            $("th i.desc").removeClass("desc");
            $("th i.asc").removeClass("asc");
            $(".order-current").removeClass("order-current");
            el.addClass("order-current");
            if (ficlass == 'desc') {
                fi.removeClass("desc");
                fi.addClass("asc");
                fi.attr("title", "当前是升序");
                el.attr("data-order", "asc");
            } else if (ficlass == 'asc') {
                fi.removeClass("asc");
                fi.attr("title", "点击可以设置排序方式");
                el.attr("data-order", "");
                $(".order-current").removeClass("order-current");
            } else {
                fi.addClass("desc");
                fi.attr("title", "当前是降序");
                el.attr("data-order", "desc");
            }

	        <button v-if="qxByQxm('PZZD')" class="btn btn-primary btn-sm" :href="'sjdx/list.do?dxdm=SYS_SJGL_SJZD&myparams='+pzzdUrl"

	<!--查询结果展示区 -->
	<div v-if="lbms=='list'">

	<div v-if="lbms=='bar'" sm="柱状图">

			style="width: 80%;height:500px;position: absolute;margin-left: 100px;">

	</div>
    <div v-if="lbms=='bar1'" sm="条形图">
        <my-echarts :key="sjdx.dxdm+'bar1'" :sjdx="sjdx" :lbmsinfo="lbmsinfo('bar1')" :rows="rows"
            style="width: 80%;height:500px;position: absolute;margin-left: 100px;">
        </my-echarts>
    </div>
    <div v-if="lbms=='line'">
        <my-echarts :key="sjdx.dxdm+'line'" :sjdx="sjdx" :lbmsinfo="lbmsinfo('line')" :rows="rows"
            style="width: 80%;height:500px;position: absolute;margin-left: 100px;">
        </my-echarts>
    </div>
	<div v-if="lbms=='zdy'">
		<my-table-zdy :lbfields="lbfields" :rows='rows' :lbls="lbls"
			:listFromid = 'listFromid' :lbkbj = 'lbkbj' :listEditData = 'listEditData'

		</my-table-zdy>
	</div>
	<!--分页渲染后放到这个元素中 -->
	<div :style="lbmsVal=='list'?'':'display: none;'"
		 class="row pagination width_100">
	</div> 
 </div>
</div>
</div>
</div>
</script>
<script type="text/javascript">
//导出excel按钮控件
Vue.component('my-zssjdx', {
    props: ['fromdata','sjdxid'],
    template:"#my-zssjdx-tp",
    data: function () {
        return {
            rows:[],
            listPage:new PageAjax(),
            listEditData:[],
            sjplscField:{
                    kzxx:{
                        file:{
                            ywdm:"other",
                            wjlb:"other"
                        }
                    }
                },
                lbmsVal:null,
             lbmsfield:{
                "bjzs": "1",
                "gxsj": "20181219101612",
                "xzmrz": "list",
                "cjsj": "20181211224727",
                "kzxx": {},
                "id": "862C5DD21DFD4E03ABE18D5431A34369",
                "xzzs": "1",
                "zdlx": "VARCHAR2",
                "zdzdlb": "SYS_SJGL_LBMS",
                "sjdx": "SYS_SJGL_SJDX",
                "hdyzgz": "notNull;zd:SYS_SJGL_LBMS;",
                "zdcd": 8,
                "yxx": "1",
                "zddm": "my-lbms",
                "yxpx": "0",
                "zdqp": "YOUXIAOXING",
                "zdmc": "列表模式",
                "zdkd": 80,
                "cxbt": "0",
                "mbzs": "1",
                "cxzs": "1",
                "zdfy": "0",
                "zddx": "0",
                "lbzs": "0",
                "cxmrz": "1",
                "zdjp": "YXX",
                "yxbj": "1",
                "xqzs": "1",
                "kjlx": "dict",
                "px": 370,
                "bjbt": "1"
            }
        }
      },
      created : function(){
          var _this = this;
          this.$root.listPage = this.listPage;
          var data = this.$data;
   		  $.ajax({url : "sjdx/jcxx.do",
	        type : "post",
            async : false,
            data : {id:this.sjdxid},
            success:function(result){
    			if(result.status){
    			    var rd = result.data;
    			    _this.$root.sjdx = data.sjdx = rd.sjdx;
    			    _this.$root.fields = data.fields = rd.fields;
    			    _this.$root.user = data.user = rd.user;
    			    _this.$root.kzxx = data.kzxx = rd.kzxx;
    			    var lbymkz = rd.kzxx.lbymkz;
    			    if(lbymkz&&lbymkz["列表模式字典数据"]){
    			        data.lbmsfield.kzxx["字典数据"]=lbymkz["列表模式字典数据"];
    			    }
      			    _this.$root.frommap[_this.queryFromid]={};
      			    _this.$root.frommap[_this.listFromid]={};
    			}else{
    	        	redict(result);
    			}
   			}});
          data.action=this.action;
      	},
	      computed : {
	          dcpcl:function (){
	              var dcpcl = fromdata['my-dcpcl'];
	              if(!dcpcl&&this._data.kzxx.lbymkz){
	                  dcpcl = this._data.kzxx.lbymkz['my-dcpcl'];
	              }
	              return dcpcl||",操作,序号";
	          },
	             defaultLbms:function (){
		              var lbmsVal = fromdata['my-lbms'];
		              if(!lbmsVal&&this._data.kzxx.lbymkz){
		                  lbmsVal = this._data.kzxx.lbymkz['my-lbms'];
		              }
		              if(!lbmsVal){
		                  lbmsVal = "list";
		              }
		              return lbmsVal;
		          },
		          lbms:function(){
		              if(this.lbmsVal){
		                  return this.lbmsVal;
		              }else{
		                  return this.defaultLbms;
		              }
		          },
	          cxanmc:function (){
	              var anmc = fromdata['my-cxanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-cxanmc'];
	              }
	              return anmc;
	          },
	          xjanmc:function (){
	              var anmc = fromdata['my-xjanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-xjanmc'];
	              }
	              return anmc;
	          },
	          plscanmc:function (){
	              var anmc = fromdata['my-plscanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-plscanmc'];
	              }
	              return anmc;
	          },
	          lbkbj:function (){
	              var lbkbj = fromdata['my-lbkbj'];
	              if(!lbkbj&&this._data.kzxx.lbymkz){
	                  lbkbj = this._data.kzxx.lbymkz['my-lbkbj'];
	              }
	              return lbkbj;
	          },
	          fields : function (){ return this._data.fields;},
	          sjdx : function (){
					return this._data.sjdx;
				},
	          queryFromid : function (){ return "queryFromid-"+this.sjdx.id;},
	          listFromid : function (){ return "listFromid-"+this.sjdx.id;},
			  myFromStyle : function (){
			      var style = "";
			      var isCxtj = true;
	              if(fromdata['my-cxtj']!=undefined){
	                  isCxtj = fromdata['my-cxtj']!='0';
	              }else{
	                  isCxtj = this._data.sjdx.cxtj!='0';
	              }
	              //||!this.qxByQxm("CXQX")
	              if(!isCxtj){
	                  style+="display: none;";
	              }
	              return style;
				},
		      lbfields : function (){ return clone(this._data.fields);},
	          action:function (){ return "sjdx/page.do?dxdm="+this._data.sjdx.dxdm;},
	          lbls:function (){
	              var num=0;
	              var sfs = this.fields;
	              Object.keys(sfs).forEach(function(key){
	                  if(!(sfs[key].lbzs==false)){
	                      num++;
	                  }
	             });
	             return num;
	          },
		      bjmsUrl:function(){
		          var data = clone(fromdata);
		          data["my-lbkbj"] = "1";
	              return encodeURI(JSON.stringify(data));
		      },
		      pzzdUrl:function(){
	              return encodeURI(JSON.stringify({sjdx:this.sjdx.id,dxmc:this.sjdx.dxmc,'my-lbkbj':'1'}));
		      },
	          addUrl:function(){
	              return encodeURI(JSON.stringify({"sjdx":this.sjdx.id}));
	          },
	          pzdxUrl:function(){
	              return encodeURI(JSON.stringify({"id":this.sjdx.id}));
	          }
	      },
        methods : {
            zdcx:function(){
                var e = event || window.event || arguments.callee.caller.arguments[0];
                if(e && e.keyCode==13){ // enter 键
                    this.listPage.queryPage();
                }
            },
	          lbmsinfo:function(lbms){
	              var lbmszd = this.lbmsfield.kzxx["字典数据"];
	              for(var i in lbmszd){
	                  if(lbmszd[i].dm==lbms){
	                      return lbmszd[i];
	                  }
	              }
	          },
            plscTitle:function(){
            	layer.tips("请先下载模板，严格按照模板要求填充数据，数据验证要求与单个上报一致，只有全部数据验证通过才能上传成功",
            	        $(this.$el).find(".plscTitle"));
            },
	        plscmbTitle:function(){
            	layer.tips("请严格按照模板填充数据，注意模板中的提示信息",$(this.$el).find(".plscmbTitle"));
            },
            downloadTemplate:function(){
            	//下载模板
            	$.download("sjdx/getMb.do?dxdm="+this._data.sjdx.dxdm,{});
            },
	        expe:function(){
	            ExportExcel.saveAsExcel(this.$root.listPage,this.sjdx.dxmc+"-当前页",this.dcpcl);
	        },
	        expeAll:function(){
	            ExportExcel.exportAll(this.$root.listPage,this.sjdx.dxmc+"-全部",this.dcpcl);
	        },
	          qxByQxm : function (qxm){
					var user = this._data.user;
					return user.qxMap[user.map[this.sjdx.dxdm]+"_"+qxm];
				},
	          lbymkz:function (kznr){
	              var k = fromdata[kznr];
	              if(!k&&this._data.kzxx.lbymkz){
	                  k = this._data.kzxx.lbymkz[kznr];
	              }
	              return k;
	          },
	        fieldBt:function(field){
	            //判断是否必填
	            field.btzt = (this.lbkbj=='1'&&field.bjbt=='1');
	            field.lbkbj=(this.lbkbj=='1');
	            return field;
	        },
		    fval:function(row,field){
		        if(row[field.zddm]!=undefined){
		            return row[field.zddm];
		        }else{
		            return field.xzmrz;
		        }
		    },
            setval:function(field,event){
                this.fromdata[field.zddm] = event.val;
                if(event.target.mc){
                    this.fromdata['map.'+field.zddm]=event.mc;
                }
                console.log(field.zdmc + "=" + this.fromdata[field.zddm]); 
             },
             lbmssetval:function(field,event){
                this.lbmsVal = event.val;
             },
             setvalTh:function(field,event){
                 var _this = this;
                 var ed = _this.listEditData;
                 for(var i=0;i<ed.length;i++){
                     event.ri=i;
                     _this.setvalList(field, event,_this);
                     _this.rows[i][field.zddm]=event.val;
                 }
             },
             setvalList:function(field,event,_this){
                 if(!_this){
                     _this = this;
                 }
                var r = event.ri;
                if(_this.listEditData[r][field.zddm]||_this.listPage.rows[r][field.zddm]!=event.val){
                    Vue.set(_this.listEditData[r],field.zddm,event.val);
                    if(field.zdywlb!='99'){
                        //非虚拟字段
                        Vue.set(_this.listEditData[r],'my-ybj',"1");
                    }
                    if(event.mc){
                        _this.listEditData[r]['map.'+field.zddm]=event.mc;
                    }
                    console.log(r+"-"+field.zdmc+ "=" + _this.listEditData[r][field.zddm]);
                }
              },
	        plcl:function(cllx,_this,options){
	            if(!_this){
		            _this = this;
	            }
	            if(!options){
	                options={};
	            }
                var ed = _this.listEditData;
                var ids = "";
                for(var i=0;i<ed.length;i++){
					if(ed[i]['my-lbxz']=='1'){
					    ids=ids+","+ed[i][_this.sjdx.zjzd];
					}
                }
                if(ids==""&&!(options.bxlbh==false)){
                    alertError("请选择要操作行");
                    return;
                }
                options.id=_this.sjdx.id;
                options['e_cllx']=cllx;
                options['e_ids']=ids.substring(1);
            	var loadindex = layer.load(0,{
            		shade: [0.3]
            	});
	            ajax('sjdx/plcl.do',{
	                fromdata:options,
	                qrts:options.qrts,
	                success:function(data){
        	   		 	_this.listPage.queryPage(); //执行页面刷新函数 
		                layer.close(loadindex);
	                }
	            });
	        },
            sjplsc:function(field,e){
                this.plcl("sjplsc",null,{"e_file":JSON.stringify(e.rep),"bxlbh":false,"qrts":false});
            },
              saveListData:function(){
                  var _this = this;
                  fromdata.id=_this._data.sjdx.id;
                  if(!myValidFrom(_this,'saveList')){
                      return;
                  }
                  fromdata.myparams = JSON.stringify({"listEditData":_this.listEditData});
	              ajax("sjdx/saveListData.do",{fromdata:fromdata,
	                  success:function(data){
		    			  _this.listPage.refreshPage();
		              }
	              });
              },
              reloadTree:function(){
                  var _this = this;
                  var zTree = $.fn.zTree.getZTreeObj('leftTree-'+_this.sjdx.id),
					type = "refresh",
					silent = false,
					nodes = zTree.getSelectedNodes();
					if (nodes.length == 0) {
						alertInfo("请先选择一个父节点");
					}
					for (var i=0, l=nodes.length; i<l; i++) {
						zTree.reAsyncChildNodes(nodes[i], type, silent);
						if (!silent) zTree.selectNode(nodes[i]);
					}
              },
              initTree:function(){
                    var _this = this;
		            if(!_this.lbymkz("my-istree")){
		                return;
		            }
		            var fjd = "fjd";
		            if(_this.lbymkz("fjdzddm")){
		                fjd = _this.lbymkz("fjdzddm");
		            }
                  	var setting = {
              			data: {
              				simpleData: {
              					enable: true
              				}
              			},
              			view:{
          				    fontCss: setNode,
              			    showLine:true,
              			    showIcon:true,
              			    nameIsHTML:true
              			},
              			async: {
              				enable: true,
              				url:"sjdx/getdata.do?dxdm="+_this.sjdx.dxdm,
              				autoParam:["dm=e_"+fjd],
              				otherParam:{"e_cllx":"getTreeCN"},
              				dataFilter: treefilter
              			},
              			callback: {
              				onClick: treeClick
              			}
              		};
					//树节点的单击事件
	          		function treeClick(event, treeId, treeNode, clickFlag) {
					    Vue.set(_this.fromdata,fjd,treeNode.dm);
	          		}
	          		//处理后台返回的数据
	          		function treefilter(treeId, parentNode, rep) {
	          			if (!rep.status) return null;
	          			var list = rep.data.list;
	          			for (var i=0, l=list.length; i<l; i++) {
	          				list[i].isParent=(list[i].parent>0)
	          			}
	          			return list;
	          		}
	          		//节点展示前的处理
	                function setNode(treeId, node) {
	                    if(node.myIcon){
	                        node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
	                    }
	                    if(node.icon){
	                        node.icon=getDownloadUrl()+"?id="+node.icon;
	                    }
	          			return {};
	          		}
		            $.fn.zTree.init($('#leftTree-'+_this.sjdx.id), setting);
              }
        },
        mounted: function () {
            var _this = this;
            this.listPage.setPageId("#"+this.$el.id);
            this.listPage.paramType = "jsonStr";
            this.listPage.listFrom = _this;
            this.listPage.exportUrl = "sjdx/export.do?dxdm="+_this.sjdx.dxdm;
            this.listPage.fytjxs = _this.sjdx.fytjxs;
            if(typeof(initPage)=='function'){
                initPage(this.listPage);
            }
            this.listPage.callback = function(data){
                var rows = data.list;
                _this.listEditData = [];
                for(var i=0;i<rows.length;i++){
   	              var p = {};
 	              p[_this.sjdx.zjzd]=rows[i][_this.sjdx.zjzd];
                  _this.listEditData.push(p);
                  rows[i]['my-lbxz']='0';
                }
            }
            if(!(_this.sjdx.cscx=='0')){
                this.listPage.queryPage();
            }
            //初始化左侧树
            _this.initTree();
        }
  });
</script>

    <li>
        <i class="icon ion-home"></i>

<div>
<div :style="'width: 200px;float: left;height: calc(( 100vh - 38px ));background-color: honeydew;overflow: auto;'+(isTreeShow?'':'display: none;')">

<ul :id="'leftTree-'+sjdx.id" class="ztree"></ul>

</div>

<my-from class="queryForm" :fromdata="fromdata" pagemodel="search" :fromid='queryFromid'

</my-from>
<div class="panel panel-default">

			<my-checkbox edit="true" :field="czqbsjField" @setval="setCzqbsj">
			</my-checkbox>操作全部
		</span>
		<div class="btn-group" role="group" aria-label="列表操作">
			<button v-if="isTreeShow" class="btn btn-primary btn-sm" @click="reloadTree">
        		<i class="icon ion-refresh"></i> 重载树
    		</button>
			<button v-if="lbkbj=='1'" class="btn btn-primary btn-sm" @click="saveListData"><i class="icon ion-android-lock"></i> 保存数据</button>
	        <button v-if="qxByQxm('XZQX')" class="btn btn-primary btn-sm" :href="'sjdx/edit.do?dxdm='+sjdx.dxdm+'&pagemodel=add'"
				a-oper="other" :title='"新建【"+sjdx.dxmc+"】"'><i class="icon ion-ios-plus-outline"></i> {{xjanmc||'新建'}}</button>
	        <button v-if="qxByQxm('PLSC')" class="btn btn-primary btn-sm" @click="plcl('plsc')"><i class="icon ion-ios-trash-outline"></i> {{plscanmc||'批量删除'}}</button>
	        <button v-if="!(lbkbj=='1')&&qxByQxm('BJMS')" class="btn btn-primary btn-sm" 
				:href="'sjdx/list.do?dxdm='+sjdx.dxdm+'&myparams='+bjmsUrl"
	            a-oper="newTab"><i class="icon ion-edit"></i> 编辑模式</button>
			<my-file v-if="qxByQxm('SJPLSC')" edit="true" :field="sjplscField" @setval="sjplsc"
 				title="请先下载模板，不要修改模板格式，按照模板要求进行数据填充">
				批量上传<!--<i style="margin-left: 5px;"
			    	class="icon ion-ios-help-outline plscTitle" 
			    	@mouseover="plscTitle(this)"></i>-->
			</my-file>
			<button v-if="qxByQxm('MBXZ')" class="btn btn-primary btn-sm" @click="downloadTemplate()"

<script type="text/javascript">
//导出excel按钮控件
Vue.component('my-list', {
    props: ['fromdata','sjdxid'],
    template:"#my-list-tp",
    data: function () {
        return {
            rows:[],
            dcwjmc:"",
            czqbsj:false,
            listPage:new PageAjax(),
            listEditData:[],
            sjplscField:{
                    kzxx:{
                        file:{
                        }
                    }
            },
            czqbsjField:{
                kzxx:"{}"
            },
            isTreeShow:true
        }
      },
      created : function(){
          var _this = this;
          this.$root.listPage = this.listPage;
          var data = this.$data;
   		  $.ajax({url : "sjdx/jcxx.do",
	        type : "post",
            async : false,
            data : {id:this.sjdxid,userInfo:_this.fromdata.userInfo},
            success:function(result){
    			if(result.status){
    			    var rd = result.data;
    			    _this.$root.sjdx = data.sjdx = rd.sjdx;
    			     _this.sjplscField.kzxx.file={

                             qcwj:'0'
                         };
    			    _this.$root.fields = data.fields = rd.fields;
    			    _this.$root.user = data.user = rd.user;
    			    _this.$root.kzxx = data.kzxx = rd.kzxx;
      			    _this.$root.frommap[_this.queryFromid]={};
      			    _this.$root.frommap[_this.listFromid]={};
      			    _this.isTreeShow= _this.lbymkz('my-istree');
    			}else{
    	        	redict(result);
    			}
   			}});
            data.action=this.action;
		  	dcwjmc = this.lbymkz("dcwjmc");
            if(!dcwjmc){
                dcwjmc = this.sjdx.dxmc;
            }
            this.dcwjmc = dcwjmc;
      	},
	      computed : {
	          dcpcl:function (){
	              //导出排除列
	              var dcpcl = this.lbymkz('my-dcpcl');
	              return dcpcl||",操作,序号";
	          },
	          cxanmc:function (){
	              var anmc = this.lbymkz('my-cxanmc');
	              return anmc;
	          },
	          xjanmc:function (){
	              var anmc = this.lbymkz('my-xjanmc');
	              return anmc;
	          },
	          plscanmc:function (){
	              var anmc = this.lbymkz('my-plscanmc');
	              return anmc;
	          },
	          lbkbj:function (){
	              var lbkbj = this.lbymkz('my-lbkbj');
	              return lbkbj;
	          },
	          fields : function (){ return this._data.fields;},
	          sjdx : function (){
					return this._data.sjdx;
				},
	          queryFromid : function (){ return "queryFromid-"+this.sjdx.id;},
	          listFromid : function (){ return "listFromid-"+this.sjdx.id;},
			  myFromStyle : function (){
			      var style = "";
			      var isCxtj = true;
	              if(fromdata['my-cxtj']!=undefined){
	                  isCxtj = fromdata['my-cxtj']!='0';
	              }else{
	                  isCxtj = this._data.sjdx.cxtj!='0';
	              }
	              //||!this.qxByQxm("CXQX")
	              if(!isCxtj){
	                  style+="display: none;";
	              }
	              return style;
				},
		      lbfields : function (){ return clone(this._data.fields);},
	          action:function (){ return "sjdx/page.do?dxdm="+this._data.sjdx.dxdm;},
	          lbls:function (){
	              var num=0;
	              var sfs = this.fields;
	              Object.keys(sfs).forEach(function(key){
	                  if(!(sfs[key].lbzs==false)){
	                      num++;
	                  }
	             });
	             return num;
	          },
		      bjmsUrl:function(){
		          var data = clone(fromdata);
		          data["my-lbkbj"] = "1";
	              return encodeURI(JSON.stringify(data));
		      },
		      getHelpUrl:function(){
		          return serviceAddr+'/sjdx/edit.do?pagemodel=details&dxdm=SYS_SJGL_GRBJ_ZS&e_id='+this.lbymkz('my-help');
		      },
		      pzzdUrl:function(){
	              return encodeURI(JSON.stringify({sjdx:this.sjdx.id,'my-lbkbj':'1'}));
		      },
	          addUrl:function(){
	              return encodeURI(JSON.stringify({"sjdx":this.sjdx.id}));
	          },
	          pzdxUrl:function(){
	              return encodeURI(JSON.stringify({"id":this.sjdx.id}));
	          }
	      },
        methods : {
            zdcx:function(){
                var e = event || window.event || arguments.callee.caller.arguments[0];
                if(e && e.keyCode==13){ // enter 键
                    this.listPage.queryPage();
                }
            },
            treeShow:function(){
                this.isTreeShow = (this.isTreeShow==false);
            },
            plscTitle:function(){
            	layer.tips("请先下载模板，严格按照模板要求填充数据，数据验证要求与单个上报一致，只有全部数据验证通过才能上传成功",
            	        $(this.$el).find(".plscTitle"));
            },
	        plscmbTitle:function(){
            	layer.tips("请严格按照模板填充数据，注意模板中的提示信息",$(this.$el).find(".plscmbTitle"));
            },
            downloadTemplate:function(){
            	//下载模板
            	$.download("sjdx/getMb.do?dxdm="+this._data.sjdx.dxdm,{});
            },
	        expe:function(){
	            ExportExcel.saveAsExcel(this.$root.listPage,this.dcwjmc+"-当前页",this.dcpcl);
	        },
	        expeAll:function(){
	            ExportExcel.exportAll(this.$root.listPage,this.dcwjmc+"-全部",this.dcpcl);
	        },
	          qxByQxm : function (qxm){
					var user = this._data.user;
					return user.qxMap[user.map[this.sjdx.dxdm]+"_"+qxm];
				},
	          lbymkz:function (kznr){
	              var k = fromdata[kznr];
	              if(!k&&this._data.kzxx.lbymkz){
	                  k = this._data.kzxx.lbymkz[kznr];
	              }
	              return k;
	          },
	        fieldBt:function(field){
	            //判断是否必填
	            field.btzt = (this.lbkbj=='1'&&field.bjbt=='1');
	            field.lbkbj=(this.lbkbj=='1');
	            return field;
	        },
		    fval:function(row,field){
		        if(row[field.zddm]!=undefined){
		            return row[field.zddm];
		        }else{
		            return "";
		        }
		    },
            setCzqbsj:function(field,event){
                this.czqbsj=event.val=='1';
            },
            setval:function(field,event){
                this.listPage.newParams[field.zddm] = event.val;
                if(field.kjlx=='dict'){
                    this.listPage.newParams[field.zddm+"_text"]=event.mc;
                }
                console.log(field.zdmc + "=" + event.val); 
             },
             lbmssetval:function(field,event){
                this.fromdata[field.zddm] = event.val.trim();
                if(event.mc){
                    this.fromdata['map.'+field.zddm]=event.mc;
                }
                console.log(field.zdmc + "=" + this.fromdata[field.zddm]); 
             },
             setvalTh:function(field,event){
                 var _this = this;
                 var ed = _this.listEditData;
                 for(var i=0;i<ed.length;i++){
                     event.ri=i;
                     _this.setvalList(field, event,_this);
                     _this.rows[i][field.zddm]=event.val;
                 }
             },
             setvalList:function(field,event,_this){
                 if(!_this){
                     _this = this;
                 }
                var r = event.ri;
                if(_this.listEditData[r][field.zddm]||_this.listPage.rows[r][field.zddm]!=event.val){
                    if(field.zdywlb!='99'&&!_this.listEditData[r][field.zddm]){
                        //非虚拟字段
                        Vue.set(_this.listEditData[r],'my-ybj',"1");
                    }
                    Vue.set(_this.listEditData[r],field.zddm,event.val);
                    if(event.mc){
                        _this.listEditData[r]['map.'+field.zddm]=event.mc;
                    }
                    console.log(r+"-"+field.zdmc+ "=" + _this.listEditData[r][field.zddm]);
                }
              },
	        plcl:function(cllx,_this,options){
	            if(!_this){
		            _this = this;
	            }
	            if(!options){
	                options={};
	            }
	            if(_this.czqbsj){
	                options['e_my-cxtj']=JSON.stringify(_this.listPage.params);
	            }else{
	                var ed = _this.listEditData;
	                var ids = "";
	                for(var i=0;i<ed.length;i++){
						if(ed[i]['my-lbxz']=='1'){
						    ids=ids+","+ed[i][_this.sjdx.zjzd];
						}
	                }
	                //选择的id为空且需列表行
	                if(ids==""&&!(options.bxlbh==false)){
	                    alertError("请选择要操作行");
	                    return;
	                }
	                options['e_ids']=ids.substring(1);
	                if(options.plczqt){
	                    return options.plczqt(options['e_ids']);
	                }
	            }
                
                options.id=_this.sjdx.id;
                options['e_cllx']=cllx;
            	var loadindex = layer.load(0,{
            		shade: [0.3]
            	});
            	var end = options.end;
            	options.end = null;
	            ajax('sjdx/plcl.do',{
	                fromdata:options,
	                qrts:options.qrts,
	                success:function(data){
	                    if(end){
	                        end(data,_this);
	                    }else{
	        	   		 	_this.listPage.queryPage(); //执行页面刷新函数 
	                    }
		                layer.close(loadindex);
	                },
	                error:function(data){
	                    if(end){
	                        end(data,_this);
	                    }
		                layer.close(loadindex);
	                },
	                qxbtn:function(){
		                layer.close(loadindex);
	                }
	            });
	        },
            sjplsc:function(field,e){
                this.plcl("sjplsc",null,{"e_file":JSON.stringify(e.rep),"bxlbh":false,"qrts":false,
                    end:function(data,_this){
                    	if(!data.status&&data.code=='sjnrcw'){
                    		popUpFullWinLayer({"url":"sjdx/list.do?dxdm=SYS_LOG_SJSCCW&e_sjwj="+e.val,
                    	        "name":"数据上传错误信息列表"});
                    	}else{
	        	   		 	_this.listPage.queryPage(); //执行页面刷新函数 
                    	}
                    }});
            },
              saveListData:function(){
                  var _this = this;
                  var _params = $.extend({},fromdata, {id:_this._data.sjdx.id});
                  if(!myValidFrom(_this,'saveList')){
                      return;
                  }
                  var le = [];
                  for(var row in _this.listEditData){
                      if(_this.listEditData[row]["my-ybj"]=='1'){
                          le.push(_this.listEditData[row]);
                      }
                  }
                  _params.myparams = JSON.stringify({"listEditData":le});
	              ajax("sjdx/saveListData.do",{fromdata:_params,
	                  success:function(data){
		    			  _this.listPage.refreshPage();
		              }
	              });
              },
              reloadTree:function(){
                  var _this = this;
                  var zTree = $.fn.zTree.getZTreeObj('leftTree-'+_this.sjdx.id),
					type = "refresh",
					silent = false,
					nodes = zTree.getSelectedNodes();
					if (nodes.length == 0) {
						alertInfo("请先选择一个父节点");
					}
					for (var i=0, l=nodes.length; i<l; i++) {
						zTree.reAsyncChildNodes(nodes[i], type, silent);
						if (!silent) zTree.selectNode(nodes[i]);
					}
              },
              initTree:function(){
                    var _this = this;
		            if(!_this.lbymkz("my-istree")){
		                return;
		            }
		            var fjd = "fjd";
		            if(_this.lbymkz("fjdzddm")){
		                fjd = _this.lbymkz("fjdzddm");
		            }
                  	var setting = {
              			data: {
              				simpleData: {
              					enable: true
              				}
              			},
              			view:{
          				    fontCss: setNode,
              			    showLine:true,
              			    showIcon:true,
              			    nameIsHTML:true
              			},
              			async: {
              				enable: true,
              				url:"sjdx/getdata.do?dxdm="+_this.sjdx.dxdm,
              				autoParam:["dm=e_"+fjd],
              				otherParam:{"e_cllx":"getTreeCN"},
              				dataFilter: treefilter
              			},
              			callback: {
              				onClick: treeClick,
              				onRightClick: zTreeOnRightClick
              			}
              		};
                  	var treeSetting = this.lbymkz("treeSetting");
                  	if(treeSetting){
                  		setting = $.extend({},setting, treeSetting);
                  	}
                    var ssjddm = _this.lbymkz("ssjddm")||"dm";
					//树节点的单击事件
	          		function treeClick(event, treeId, treeNode, clickFlag) {
					    Vue.set(_this.fromdata,ssjddm,treeNode.dm);
                        Vue.set(_this.fromdata,fjd,"");
					    _this.listPage.queryPage();
	          		}
					//树右击事件
                    function zTreeOnRightClick(event, treeId, treeNode) {
                        Vue.set(_this.fromdata,fjd,treeNode.dm);
                        Vue.set(_this.fromdata,ssjddm,"");
                        _this.listPage.queryPage();
// 			            if (treeNode && !treeNode.noR) {
// 			                zTree.selectNode(treeNode);
// 			                showRMenu(event.clientX, event.clientY);
// 			            }
                    }
	          		//处理后台返回的数据
	          		function treefilter(treeId, parentNode, rep) {
	          			if (!rep.status) return null;
	          			var list = rep.data.list;
	          			for (var i=0, l=list.length; i<l; i++) {
	          				list[i].isParent=(list[i].parent>0)
	          			}
	          			return list;
	          		}
	          		//节点展示前的处理
	                function setNode(treeId, node) {
	                    if(node.myIcon){
	                        node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
	                    }
	                    if(node.icon){
	                        node.icon=getDownloadUrl()+"?id="+node.icon;
	                    }
	          			return {};
	          		}
		            $.fn.zTree.init($('#leftTree-'+_this.sjdx.id), setting);
              }
        },
        mounted: function () {
            var _this = this;
            this.listPage.setPageId("#"+this.$el.id);
            this.listPage.paramType = "jsonStr";
            this.listPage.listFrom = _this;
            this.listPage.exportUrl = "sjdx/export.do?dxdm="+_this.sjdx.dxdm;
            this.listPage.fytjxs = _this.sjdx.fytjxs;
            if(typeof(initPage)=='function'){
                initPage(this.listPage,_this);
            }
            this.listPage.callback = function(data){
                var rows = data.list;
                _this.listEditData = [];
                for(var i=0;i<rows.length;i++){
   	              var p = {};
 	              p[_this.sjdx.zjzd]=rows[i][_this.sjdx.zjzd];
                  _this.listEditData.push(p);
                  rows[i]['my-lbxz']='0';
                }
            }
            if(!(_this.sjdx.cscx=='0')){
                this.listPage.queryPage();
            }
            //初始化左侧树
            _this.initTree();
       		//水印
           	watermark({"watermark_txt":_this._data.user.yhxm+","+_this._data.user.sfzh});
       		if(this.lbymkz("通知公告")){
                var url = this.lbymkz("通知公告");
                if(!url.startWith("http")){
                    //此场景为配置的文档id
                    url = serviceAddr+"sjdx/edit.do?pagemodel=details&dxdm=SYS_SJGL_GRBJ_ZS&e_id="+url;
                }
       		    if(this.lbymkz("my-tzgg-full")){
                    popUpFullWinLayer({url:url,name:"通知公告"});
       		    }else{
                    popUpWinLayer({url:url,name:"通知公告"});
       		    }
       		}
        }
  });
</script>

<script type="text/javascript">
Vue.component('my-edit', {
    props: ['fromdata','sjdxid','pagemodel'],
    template:"#my-edit-tp",
    data: function () {
      return {
       method : 'post',
       action:'sjdx/save.do?id='+this.sjdxid,
       editdata:{},
       updatedata:{}
      }
    },
    created : function(){
        var _this = this;
        var data = _this._data;
        var params = {id:_this.sjdxid};
        params.myparams = JSON.stringify(fromdata);
 		$.ajax({url : "sjdx/jcxx.do",
	      type : "post",
          async : false,
          data : params,
          success:function(result){
  			if(result.status){
  			    var rd = result.data;
			    _this.$root.sjdx = data.sjdx = rd.sjdx;
			    data.kzxx = rd.kzxx;
  			    data.fields = rd.fields;
  			    data.user = rd.user;
  			    var zjzd = rd.sjdx.zjzd;
  			    var zj = rd.obj[rd.sjdx.zjzd];
  			    if(zj){
  			        data.action += '&e_cllx=update';
  			    }else{
                    data.action += '&e_cllx=insert';
  			    }
  			    _this.updatedata[zjzd]=zj;
  			    _this.editdata = rd.obj;
  			    _this.$root.frommap[_this.fromid]={};
  			}else{
	        	redict(result);
  			  }
 			}
          });
 		data.action = this.action;
 		data.index = this.index;
    },
    computed : {
        fields : function (){ return this._data.fields},
        sjdx : function (){ return this._data.sjdx },
//         action : function (){ return 'sjdx/save.do?id='+this.sjdxid },
        mydqan : function(){
			return this.bjymkz('my-qdan');
        },
        index : function (){
            if(this.fromdata['my-bjxh']!=undefined){
                return this.fromdata['my-bjxh']!='0';
            }else{
                return this.sjdx.bjxh!='0';
            }
        },
        fromid:function(){
            return this.$root.$options.el;
        },
        getHelpUrl:function(){

				      //修改过，又还原了，就删除该属性
	                   delete this.updatedata[field.zddm];
	                   if(event.mc){
	                       delete this.updatedata['map.'+field.zddm];
	                   }
				  }
                  return;
              }
              this.updatedata[field.zddm] = event.val;
              if(event.mc){

	         	   		_this._data.updatedata=$.extend({},_this._data.updatedata,result.data);

	         	   	    }
	                    layer.close(loadindex);
 		            }
	            });
	        },
           submit:function(){
               var _this = this;
               if(this.fromdata.submitBefore){
                   if(!this.fromdata.submitBefore(_this)){
                       return false;
                   }
               }
               if(!myValidFrom(_this)){
                   return;
               }else if(!$(_this.fromid).isValid()){
                   return;
               }else{
                   if(Object.keys(_this._data.updatedata).length==1){
	    	           alertInfo("你没有修改任何数据项");
                       return;
                   }
                   if(typeof(sjdxZdyjy)=='function'){
                       //自定义校验
                       if(!sjdxZdyjy(_this._data.updatedata,_this)){
                           return;
                       }
                   }
	            	var loadindex = layer.load(0,{
	            		shade: [0.3]
	            	});
                   var _params = {myparams:JSON.stringify($.extend({},this.fromdata, _this._data.updatedata))};

                       fromdata:_params,success:function(data){

    	            	   	    if(parent.listFrom&&parent.listFrom.listPage){

   	        	   				var index = parent.layer.getFrameIndex(window.name);

            }
            if(this.bjymkz("my-tzgg-full")){
                popUpFullWinLayer({url:url,name:"通知公告"});
            }else{
                popUpWinLayer({url:url,name:"通知公告"});

  });

<script type="text/javascript">
Vue.component('my-cdym', {
    props: ['fromdata','sjdxid','pagemodel'],
    template:"#my-cdym-tp",
    data: function () {
      return {
          openCd:[],
          showCd:"",
          qtxtList:[],
          isShowKj:true
      }
    },
    created : function(){
        var _this = this;
        if(window!=top){
            parent.location.href=window.location.href;
        }
        var data = _this._data;
        var params = {id:_this.sjdxid};
        params.myparams = JSON.stringify(fromdata);
 		$.ajax({url : "sjdx/jcxx.do",
	      type : "post",
          async : false,
          data : params,
          success:function(result){
  			if(result.status){
  			    var rd = result.data;
			    _this.$root.sjdx = data.sjdx = rd.sjdx;
			    _this.kzxx = rd.kzxx;
  			    _this.user = rd.user;
  		        $("head > title").text(rd.kzxx['菜单信息']['系统名称']);
  			}else{
	        	redict(result);
  			  }
 			}
          });
        ajax("sjdx/getdata.do?dxdm=SYS_QX_QTQX&e_cllx=getQtxt",
            {success:function(r){
  			    _this.qtxtList = r.data.list;
        		},
        	 async:false,
        	 qrts:false,
        	 jgts:false
        	}
        );
    },
    computed : {
        dlfromdata:function(){
            this.fromdata.qdzdyFun=function(result){
            	alertInfo(result.data.yhxm+":"+result.msg);
            }
            return this.fromdata;
        }
    },
    methods : {
        centerLoading:function(){
            this.centerLoadingId = layer.load(0,{
        		shade: [0.3]
        	});
        },
        showKj:function(){
            this.isShowKj=this.isShowKj==false;
        },
        cdRightStyle:function(dm){
            var style = "width: 100%;height: 100%;overflow: scroll;border: snow;";
            if(dm!=this.showCd){
                style+="display: none;";
            }
            return style;
        },
        qtxtClick:function(cd){
            var ssyy = cd.ssyy;
            if(ssyy=='myservice'){
                window.open("sjdx/list.do?dxdm="+cd.dz);
            }else{
                //myservice拆分出来的子应用跳转，免登陆
                window.open("common/doDesEncryptUrl.do?projectCode="+ssyy+"&url=sjdx/list.do?dxdm="+cd.dz);
            }
        },
        bzwd:function(cd){
            window.open("sjdx/edit.do?pagemodel=details&dxdm=SYS_SJGL_GRBJ_ZS&e_id="+this.kzxx['菜单信息']['帮助文档']);
        },
        tuichu:function(){
            var _this = this;
            ajax("sjdx/plcl.do?dxdm=SYS_QX_YHXX_MRDL&e_cllx=yhtc",
                {success:function(r){
                		window.location.href="sjdx/edit.do?pagemodel=add&dxdm="+_this.kzxx['菜单信息']['登陆对象'];
            		}
            	}
            );
        },
        grsz:function(){
            var _this = this;
            popUpWinLayer({"url":"sjdx/edit.do?pagemodel=edit&dxdm=SYS_QX_YHXX_GRSZ&e_id="
                    +_this.user.id,"name":"个人信息维护"});
        },
        fileUrl:function(key){
            if(this.kzxx['菜单信息'][key]){
                return getDownloadUrl()+'?id='+this.kzxx['菜单信息'][key];
            }else{
                return "";
            }
        },
        getTx:function(){
            if(this.user.tx){
                return getDownloadUrl()+'?id='+this.user.tx;
            }else{
                return this.fileUrl("系统图标");
            }
        },
        centerLoad:function(){
            layer.close(this.centerLoadingId);
        },
        initTree:function(){
            var _this = this;
        	var setting = {
        		data: {
        			simpleData: {
        				enable: true
        			}
        		},
        		view:{
        			fontCss: setNode,
        			showLine:true,
        			showIcon:true,
        			nameIsHTML:true
        		},
        		async: {
        			enable: true,
        			url:"sjdx/getdata.do?dxdm=SYS_QX_QTQX",
        			autoParam:["dm=e_fqx"],
        			otherParam:{"e_cllx":"getTreeCN",
        			    //树模式=菜单树
        			    "e_treeModel":'cds',
        			    //菜单树根节点
        			    "e_treeRoot":this.kzxx['菜单信息']['菜单根节点']},
        			dataFilter: treefilter
        		},
        		callback: {
        			onClick: treeClick
        		}
        	};
        	//树节点的单击事件
        	function treeClick(event, treeId, treeNode, clickFlag) {
        	    var mbdz = null;
        		if(treeNode.lx=='02'){
        			console.info('这是目录');
        		}else if(treeNode.dzlx=='01'){
        			//应用地址
        			var app = zdObj({"zdlb":"SYS_QX_APP","dm":treeNode.ssyy});
        		    mbdz = app.dz+treeNode.dz;
        		}else if(treeNode.dzlx=='02'){
        			//绝对地址
        		    mbdz = treeNode.dz;
        		}else if(treeNode.dzlx=='03'){
        			//数据对象
        			mbdz = "sjdx.do?dxdm="+treeNode.dz;
        		}else if(treeNode.dzlx=='04'){
        			//数据对象列表
        			mbdz = "sjdx/list.do?dxdm="+treeNode.dz;
        		}else{
        			alertInfo('暂未实现');
        		}
        		if(mbdz!=null){
					if(mbdz.indexOf("?")==-1){
					    mbdz += "?";
					}else{
					    mbdz += "&";
					}
        		    //添加权限编码
				    mbdz += "authCode="+treeNode.dm;
        		    if(treeNode.dkfs=='01'){
        		        if($(_this.$el).find(".gnIframe."+treeNode.id).length==0){
        		            _this.centerLoading();
        		            _this.openCd.push({id:treeNode.id,src:mbdz});
        		        }else if(_this.showCd == treeNode.id){
        		            _this.centerLoading();
        		            $(_this.$el).find(".gnIframe."+treeNode.id).attr("src",mbdz);
        		        }
    		            _this.showCd = treeNode.id;
        		    }else if(treeNode.dkfs=='02'){
            			window.open(mbdz);
        		    }else if(treeNode.dkfs=='03'){
        		        var perContent  = layer.open({
      				      type: 2,
      				      title: treeNode.mc,
      				      shadeClose: true,
      				      shade: false,
      				      maxmin: true, //开启最大化最小化按钮
      				      area: ['800px', '500px'],
      				      content: mbdz
			      		});
			            layer.full(perContent);
        		    }
        		}
        	}
        	//处理后台返回的数据
        	function treefilter(treeId, parentNode, rep) {
        		if (!rep.status) {
        		    alertError(rep.msg);
        		    return null;
        		}
        		var list = rep.data.list;
        		var cdList = [];
        		for (var i=0, l=list.length; i<l; i++) {
       				list[i].isParent=(list[i].parent>0);
       				cdList.push(list[i]);
        		}
        		return cdList;
        	}
        	//节点展示前的处理
        	function setNode(treeId, node) {
        		if(node.myIcon){
        			node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
        		}
        		if(node.icon){
        			node.icon=getDownloadUrl()+"?id="+node.icon;
        		}
        		return {};
        	}
        	$.fn.zTree.init($('#leftTree-'+this.sjdxid), setting);
        }
	},
	mounted:function(){
        var _this = this;
   		//水印
       	watermark({"watermark_txt":_this.user.yhxm+","+_this.user.sfzh}); 
   		if(this.kzxx['菜单信息']["通知公告"]){
   		    var url = this.kzxx['菜单信息']["通知公告"];
   		    if(url.startWith("dqyy:")){
   		        //当前应用的页面
   		        url = url.substr(5);
   		    }else if(!url.startWith("http:")){
                //此场景为配置的文档id
                url = serviceAddr+"sjdx/edit.do?pagemodel=details&dxdm=SYS_SJGL_GRBJ_ZS&e_id="+url;
            }
            _this.showCd = "tzgg";
   	        _this.openCd.push({id:_this.showCd,src:url});
   		}
       	_this.initTree();
	}
  });
</script>

<iframe v-for="(cd,ri) in openedCdList" :style="cdRightStyle(cd.dm)" 
	:src="cd.mc" :class="zdlb+'_tab '+cd.dm"></iframe>
</div>
</script>
<script type="text/javascript">
Vue.component('my-tab', {
    props: ['fromdata','sjdxid','pagemodel'],
    template:"#my-tab-tp",
    data: function () {
      return {
          cdlist:[],
          gdcdList:[],
          zkcds:7,
          selectedCd:{},
          openedCdList:[],
          zdlb:"none"
      }
    },
    created : function(){
        var _this = this;
        var zkcds = getUrlString("e_zkcds");
        if(zkcds){
            _this.zkcds = zkcds;
        }
        _this.zdlb = getUrlString("e_zdlb");
        var list = zdList(_this.zdlb);
        var count=0;
        for (var i in list){
            var cd = list[i];
            eval("cd.kzxx = "+cd.kzxx);
            count++;
            if(count==1){
                _this.cdClick(cd);
            }
            if(count<=_this.zkcds){
                _this.cdlist.push(cd);
            }else{
                _this.gdcdList.push(cd);
            }
        }
    },
    computed : {
    },
    methods : {
        cdRightStyle:function(dm){
            var style = "width: 100%;height: 100%;overflow: scroll;border: snow;";
            if(dm!=this.selectedCd.dm){
                style+="display: none;";
            }
            return style;
        },
        cdClick:function(cd){
            var _this = this;
	        if($(_this.$el).find("."+_this.zdlb+"_tab."+cd.dm).length==0){
	            this.openedCdList.push(cd);
	        }else if(_this.selectedCd.dm == cd.dm){
	            $(_this.$el).find("."+_this.zdlb+"_tab."+cd.dm).attr("src",cd.mc);
	        }
            this.selectedCd = cd;
        }
	},
	mounted:function(){
	}
  });
</script>

<script type="text/javascript">
//vue常用方法
/**
 * 默认列表操作
 */
function defaultLbcz(value,_this) {
    if(_this.pagemodel=='cklist'||_this.pagemodel=='bjlist'){
        var data = {sjdx:_this.$root.sjdx,
    		    row:_this.$root.listPage.rows[_this.$parent.$parent.ri],
    		    user:_this.$root.user};
		var def = $("#my-default-lbcz-tp").tmpl(data).html();
	    //数据对象列表操作预处理
	    if(typeof sjdxlbczYcl == "function"){
	        sjdxlbczYcl(value,_this);
	    }
	    var qtcz = "";
	    if($("#my-sjdx-lbcz-tp").length==1){
	        qtcz = $("#my-sjdx-lbcz-tp").tmpl({sjdx:_this.$root.sjdx,
		        user:_this.$parent.$parent.$parent._data.user,
			    row:_this.$root.listPage.rows[_this.$parent.$parent.ri]}).html();
	        if(!qtcz){
	            qtcz = "";
	        }
	    }
	    return def+qtcz;
    }
    return "非列表模式";
}
/**
 * 格式化方法-列表序号
 */
function gshffLbxh(value,_this) {
    return _this.$root.listPage.getHangHao(_this.$parent.$parent.ri);
}
/**
 * 格式化方法-列表选择
 */
function gshffLbxz(value,_this) {
    return value;
}
/**
 * base64图片展示
 */
function base64TpGsh(value,_this){
    if(isEmpty(value)){
        return "没有图片";
    }else{
        //return "<img style='width:100%;' src='data:image/png;base64,"+value+"'/>";
        return $("#my-base64tpgsh-tp").tmpl({"value":value}).html();
    }
}
/**
 * 时间格式化
 */
function vueTimeGsh(value,_this){
    var qdgs = _this.WdatePicker.dateFmt;
    return dateFormat(value,qdgs);
}
/**
 * 时间反格式化：默认处理所有时间在数据库中存储的都是14位字符串
 */
function vueTimeFgsh(value,_this,event){
    var hdgs = _this.WdatePicker.hdgs;
    return dateFormat(value,hdgs);
}
/**
 * 组建编辑参数
 */
function editUrl(sjdx,row){
    var p = {};
    p[sjdx.zjzd]=row[sjdx.zjzd];
    return encodeURI(JSON.stringify(p));
}
/**
 * 判断是否有指定权限
 */
function qxByQxm(user,sjdx,qxm){
	return user.qxMap[user.map[sjdx.dxdm]+"_"+qxm];
}
/**
 * 下载
 */
function download(id){
    $.download(getDownloadUrl(),{id:id});
}
/**
 * 获取下载地址
 */
function getDownloadUrl(){
    return serviceAddr+"common/download.do";
}
</script>
