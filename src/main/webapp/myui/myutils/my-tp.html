<script type="text/javascript">
Vue.component('my-inputn', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template: '#my-inputn-tp',
    methods : {
        setval : function($event) {
            if(!this.isDict||this.field.kjlx=='suggest'){
                var sf = strFunToFun(this.field.fgshff);
                if(sf){
                    $event.val=sf($event.target.value);
                }else{
                    $event.val = $event.target.value;
                }
                this.$emit('setval', this.field, $event);
            }
        }
	},
    computed : {
        nval:function (){
            var val=this.value;
            if(!this.edit&&this.isDict){
                val = zdMcByDmMore(this.field.zdzdlb,this.value);
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalTitle:function (){
            var val=this.value;
            if(!this.edit&&this.isDict){
                val = zdMcByDmMore(this.field.zdzdlb,this.value)+"["+this.value+"]";
            }
           return val;
        },
        isDict:function (){
           return this.field.kjlx=='dict'||this.field.kjlx=='checkbox'||this.field.kjlx=='suggest';
        }
    },
    mounted: function () {
        var _this =  this;
        _this.target = this.$el;
        var field = this.field;
        if(this.isDict&&this.edit){
            var zdObj = $(this.$el);
            var zdlb = field.zdzdlb;
            var otherParam = field.otherParam||'';
            var data = serviceAddr+"common/dict/zdSearch.do?autoCount=true&map['zdlb']="
                    +zdlb+"&map['otherParam']="+otherParam;
            if(!(this.field.zdfy=='1')&&zdlb!="SYS_COMMON_ORG"){
            	data = zdList(zdlb);
            }
            var keyField = "dm";
            if(field.kjlx=='suggest'){
                keyField = "mc";
            }
            zdObj.selectPage({
            	data:data,
                showField: 'mc',
                keyField: keyField,
                searchField: "map['searchKey']",
                orderBy : ['px asc','dm asc','mc'],
                eAjaxSuccess: function(d){
                    return d;
                },
                //选中项目后的回调处理
                //入参：data：选中行的原始数据对象
                eSelect : function(data){
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc=data.mc;
                    _this.$emit('setval', field,_this);
                    if(field.eSelect){
                    	field.eSelect(data,_this,field);
                    }
                },
				// 点击select的那个叉的事件回调
                eClear : function(){
                    _this.val="";
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eClear){
                    	field.eClear(_this,field);
                    }
                },
                eTagRemove: function(datas){
                    if(datas==0){
                        return;
                    }
                    _this.val=$("[name='"+(_this.owner||'')+field.zddm+"']").val();
                    _this.mc="";
                    _this.$emit('setval', field,_this);
                    if(field.eTagRemove){
                    	field.eTagRemove(_this,field);
                    }
                },
                //仅选择模式，不允许输入查询关键字
                selectOnly : !(this.field.zdfy=='1'),
                //关闭分页栏，数据将会一次性在列表中展示，上限200个项目
                pagination : (this.field.zdfy=='1'),
                //关闭分页的状态下，列表显示的项目个数，其它的项目以滚动条滚动方式展现（默认10个）
                listSize : this.field.listSize|10,
                multiple : this.field.zddx=='1'
            });
            if(this.value){
                var data = {dm:this.value,mc:zdMcByDm(zdlb,this.value)};
                _this.val=data.dm;
                _this.mc=data.mc;
                if(field.eSelect){
                	field.eSelect(data,_this,field);
                }
            }
        }
      },
    updated: function () {
        if(this.isDict&&this.edit){
            var _this = this;
            $(this.$el).val(this.value);
            $("[name='"+(_this.owner||'')+_this.field.zddm+"']").val(this.value);
            $(this.$el).selectPageRefresh();
        }
      }
  });
</script>

<script type="text/javascript">
Vue.component('my-time', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
      }
    },
    template: '#my-time-tp',
    methods : {
        setval : function($event) {
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                $event.val=sf($event.target.value,this);
            }else{
                $event.val = $event.target.value;
            }
            this.$emit('setval', this.field, $event);
        }
	},
    computed : {
        nval:function (){
            var val=this.value;
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
            return val;
        },
        nvalTitle:function (){
            var val=this.value;
            return val;
        },
        onfocus:function (){
            return "WdatePicker("+JSON.stringify(this.dateFmt)+")";
        },
        dateFmt:function (){
            var hdgs = "yyyyMMddHHmmss";
            var hdyzgz = this.field.hdyzgz;
            if(hdyzgz){
                var gzstrs = hdyzgz.replace("；",';').split(";");
                for(idx in gzstrs){
                    var gzs = gzstrs[idx].split(":");
                    if(gzs[0]=='date'){
                        if(gzs[1]){
                            hdgs = gzs[1];
                        }
                        break;
                    }
                }
            }
            var dateFmt = 'yyyy-MM-dd';
            var maxDate = '%y-%M-%d';
            if(this.pagemodel!='search'){
                dateFmt = "yyyy-MM-dd HH:mm:ss";
                maxDate = "%y-%M-%d %H:%m:%s";
            }
            return {dateFmt:dateFmt,readOnly:true,maxDate:maxDate,hdgs:hdgs};
        }
    }
  });
</script>

<script type="text/javascript">
Vue.component('my-timeaera', {
    props: ['field','index','value','owner','pagemodel','edit'],
    data: function () {
      return {
          startData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          endData:{dateFmt:'yyyy-MM-dd',readOnly:true,maxDate:'%y-%M-%d'},
          times:this.value||''
      }
    },
    template: '#my-timeaera-tp',
    computed : {
        nvalStart:function (){
            var times = this.times.split(";");
            if(!times[0]){
                return "";
            }
            var val=times[0];
            if(val.indexOf('goDay:')==0){
                val = new Date().addDays(val.substring(6)).format('yyyyMMddmmhhss');
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        },
        nvalEnd:function (){
            var times = this.times.split(";");
            if(!times[1]){
                return "";
            }
            var val=times[1];
            if(val.indexOf('goDay:')==0){
                val = new Date().addDays(val.substring(6)).format('yyyyMMddmmhhss');
            }
            var sf = strFunToFun(this.field.gshff);
            if(sf){
                val=sf(val,this);
            }
           return val;
        }
    },
    methods : {
        setvalStart : function($event) {
            var times = this.times.split(";");
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                times[0]=sf($event.target.value,this,$event);
            }else{
                times[0] = $event.target.value;
            }
            $event.val=times;
            this.$emit('setval', this.field, $event);
        },
	    setvalEnd : function($event) {
            var times = this.times.split(";");
            var sf = strFunToFun(this.field.fgshff);
            if(sf){
                times[1]=sf($event.target.value,this,$event);
            }else{
                times[1] = $event.target.value;
            }
            $event.val=times;
	        this.$emit('setval', this.field, $event);
	    },
	    wpStart:function(){
	        WdatePicker(this.startData);
	    },
	    wpEnd:function(){
	        WdatePicker(this.endData);
	    }
 	}
  });
</script>

<script type="text/javascript">
Vue.component('my-srkj', {
    props : [ 'field', 'index', 'value', 'data','pagemodel','fieldshow','owner' ],
    data : function() {
        return {}
    },
    computed : {
        isEdit:function(){
            var pagemodel = this.pagemodel;
            return ((pagemodel=='bjlist'||pagemodel=='edit')&&!(this.field.yxbj=='0'))
            	||pagemodel=='add'||pagemodel=='search';
        },
        isInputn:function(){
            var field = this.field;
            return (field.kjlx||'input')=='input'||field.kjlx=='dict'
            	||field.kjlx=='checkbox'||field.kjlx=='suggest'||field.kjlx=='textarea';
        },
        srkjClass:function(){
            //返回输入控件的class
            //如果是查询列表或（编辑列表且该字段不允许编辑）
            if(this.pagemodel=='cklist'||(this.pagemodel=='bjlist'&&(this.field.yxbj=='0'))){
                return "";
            }else{
                return "form-control";
            }
        }
    },
    template : '#my-srkj-tp',
    methods : {
        setval : function(field,event) {
            this.$emit('setval', field, event);
        }
    },
    created : function() {
//         console.log('初始化字段: ' + this.index + ":" 
//                 + this.field.zddm + "=" + this.value);
    },
    mounted: function () {
        var _this =  this;
        var field = this.field;
        //默认值不为空且非详情页面
        if(_this.value&&this.pagemodel!='details'&&this.pagemodel!='cklist'){
            _this.val=_this.value;
            _this.target = _this;
            _this.$emit('setval', field,_this);
        }
    }
});
</script>

	          },
	          cxanmc:function (){
	              var anmc = fromdata['my-cxanmc'];
	              if(!anmc&&this._data.kzxx.lbymkz){
	                  anmc = this._data.kzxx.lbymkz['my-cxanmc'];

	              return anmc;
	          },

	                  anmc = this._data.kzxx.lbymkz['my-xjanmc'];

	          },
	          lbkbj:function (){
	              var lbkbj = fromdata['my-lbkbj'];
	              if(!lbkbj&&this._data.kzxx.lbymkz){
	                  lbkbj = this._data.kzxx.lbymkz['my-lbkbj'];
	              }
	              return lbkbj;
	          },
	          fields : function (){ return this._data.fields;},
	          sjdx : function (){
					return this._data.sjdx;
				},
	          isAdmin : function (){
					var user = this._data.user;
					return user.yhdm=='admin';
				},
			  myFromStyle : function (){
			      var style = "";
			      var isCxtj = true;
	              if(fromdata['my-cxtj']!=undefined){
	                  isCxtj = fromdata['my-cxtj']!='0';
	              }else{
	                  isCxtj = this._data.sjdx.cxtj!='0';

	              if(!isCxtj||!this.qxByQxm("CXQX")){
	                  style+="display: none;";
	              }
	              return style;
				},
		      lbfields : function (){ return clone(this._data.fields);},
	          action:function (){ return "sjdx/page.do?dxdm="+this._data.sjdx.dxdm;},
	          lbls:function (){
	              var num=0;
	              var sfs = this.fields;
	              Object.keys(sfs).forEach(function(key){
	                  if(!(sfs[key].lbzs==false)){
	                      num++;
	                  }
	             });
	             return num;
	          },
		      bjmsUrl:function(){
		          var data = clone(fromdata);
		          data["my-lbkbj"] = "1";
	              return encodeURI(JSON.stringify(data));
		      },
		      pzzdUrl:function(){
	              return encodeURI(JSON.stringify({sjdx:this.sjdx.id,dxmc:this.sjdx.dxmc,'my-lbkbj':'1'}));
		      },
	          addUrl:function(){
	              return encodeURI(JSON.stringify({"sjdx":this.sjdx.id}));
	          },
	          pzdxUrl:function(){
	              return encodeURI(JSON.stringify({"id":this.sjdx.id}));
	          }
	      },
        methods : {
	        expe:function(){
	            ExportExcel.saveAsExcel(this.$root.listPage,this.sjdx.dxmc+"-当前页",this.dcpcl);
	        },
	        expeAll:function(){
	            ExportExcel.exportAll(this.$root.listPage,this.sjdx.dxmc+"-全部",this.dcpcl);

	          qxByQxm : function (qxm){
					var user = this._data.user;
					return user.qxMap[user.map[this.sjdx.dxdm]+"_"+qxm];
				},
	          lbymkz:function (kznr){
	              var k = fromdata[kznr];
	              if(!k&&this._data.kzxx.lbymkz){
	                  k = this._data.kzxx.lbymkz[kznr];
	              }
	              return k;
	          },
	        fieldBt:function(field){
	            //判断是否必填
	            field.btzt = (this.lbkbj=='1'&&field.bjbt=='1');
	            field.lbkbj=(this.lbkbj=='1');
	            return field;
	        },
		    fval:function(row,field){
		        if(row[field.zddm]){
		            return row[field.zddm];
		        }else{
		            return field.xzmrz;
		        }
		    },
            setval:function(field,event){
                this.fromdata[field.zddm] = event.val;
                if(event.target.mc){
                    this.fromdata['map.'+field.zddm]=event.mc;
                }
                console.log(field.zdmc + "=" + this.fromdata[field.zddm]); 
             },
             setvalTh:function(field,event){
                 var _this = this;
                 var ed = _this.listEditData;
                 for(var i=0;i<ed.length;i++){
                     event.ri=i;
                     _this.setvalList(field, event,_this);
                     _this.rows[i][field.zddm]=event.val;
                 }
             },
             setvalList:function(field,event,_this){
                 if(!_this){
                     _this = this;
                 }
                var r = event.ri;
                if(_this.listPage.rows[r][field.zddm]!=event.val){
                    Vue.set(_this.listEditData[r],field.zddm,event.val);
                    if(field.zdywlb!='99'){
                        //非虚拟字段
                        Vue.set(_this.listEditData[r],'my-ybj',"1");
                    }
                    if(event.mc){
                        _this.listEditData[r]['map.'+field.zddm]=event.mc;
                    }
                    console.log(r+"-"+field.zdmc+ "=" + _this.listEditData[r][field.zddm]);
                }
              },
	        plcl:function(cllx,_this){
	            if(!_this){
		            _this = this;

	            debugger
                var ed = _this.listEditData;
                var ids = "";
                for(var i=0;i<ed.length;i++){
					if(ed[i]['my-lbxz']=='1'){
					    ids=ids+","+ed[i][_this.sjdx.zjzd];
					}
                }
                if(ids==""){
                    alertError("请选择要操作行");
                    return;
                }
	            fromdata.id=_this.sjdx.id;

        	   		 	_this.listPage.queryPage(); //执行页面刷新函数 
					});
	            });
	        },
              saveListData:function(){
                  var _this = this;

                  fromdata.myparams = JSON.stringify({"listEditData":_this.listEditData});
	              qrtsAjax("sjdx/saveListData.do",fromdata,function(data){
            	   	alertInfoYes(data,function(){
	    			    _this.listPage.refreshPage();
					});
	              });
              },
              reloadTree:function(){
                  var _this = this;
                  var zTree = $.fn.zTree.getZTreeObj('leftTree-'+_this.sjdx.id),
					type = "refresh",
					silent = false,
					nodes = zTree.getSelectedNodes();
					if (nodes.length == 0) {
						alertInfo("请先选择一个父节点");
					}
					for (var i=0, l=nodes.length; i<l; i++) {
						zTree.reAsyncChildNodes(nodes[i], type, silent);
						if (!silent) zTree.selectNode(nodes[i]);
					}
              },
              initTree:function(){
                    var _this = this;
		            if(!_this.lbymkz("my-istree")){
		                return;
		            }
                  	var setting = {
              			data: {
              				simpleData: {
              					enable: true
              				}

              			view:{
          				    fontCss: setNode,
              			    showLine:true,
              			    showIcon:true,
              			    nameIsHTML:true
              			},
              			async: {
              				enable: true,
              				url:"sjdx/getdata.do?dxdm="+_this.sjdx.dxdm,
              				autoParam:["dm=map['fqx']"],
              				otherParam:{"map['cllx']":"getTreeCN"},
              				dataFilter: treefilter
              			},
              			callback: {
              				onClick: treeClick
              			}
              		};
					//树节点的单击事件
	          		function treeClick(event, treeId, treeNode, clickFlag) {
					    Vue.set(_this.fromdata,'fqx',treeNode.dm);
	          		}
	          		//处理后台返回的数据
	          		function treefilter(treeId, parentNode, rep) {
	          			if (!rep.status) return null;
	          			var list = rep.data.list;
	          			for (var i=0, l=list.length; i<l; i++) {
	          				list[i].isParent=(list[i].parent>0)
	          			}
	          			return list;
	          		}
	          		//节点展示前的处理
	                function setNode(treeId, node) {
	                    if(node.myIcon){
	                        node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
	                    }
	                    if(node.icon){
	                        node.icon="file/download.do?id="+node.icon;
	                    }
	          			return {};
	          		}
		            $.fn.zTree.init($('#leftTree-'+_this.sjdx.id), setting);
              }
        },
        mounted: function () {
            var _this = this;
            this.listPage.setPageId("#"+this.$el.id);
            this.listPage.paramType = "jsonStr";
            this.listPage.listFrom = _this;
            this.listPage.exportUrl = "sjdx/export.do?dxdm="+_this.sjdx.dxdm;
            this.listPage.totalDelay = _this.sjdx.fytjxs;
            if(typeof(initPage)=='function'){
                initPage(this.listPage);

            this.listPage.callback = function(data){
                var rows = data.list;

                  rows[i]['my-lbxz']='0';
                }
            }
            if(!(_this.sjdx.cscx=='0')){
                this.listPage.queryPage();
            }
            //初始化左侧树
            _this.initTree();
        }
  });
</script>

<script type="text/javascript">

            	alertInfo(result.data.yhxm+":"+result.msg);
            }
            return this.fromdata;
        }
    },
    methods : {
        centerLoading:function(){
            this.centerLoadingId = layer.load(0,{
        		shade: [0.3]
        	});
        },
        centerLoad:function(){
            layer.close(this.centerLoadingId);
        },
        initTree:function(){
            var _this = this;
        	var setting = {
        		data: {
        			simpleData: {
        				enable: true
        			}
        		},
        		view:{
        			fontCss: setNode,
        			showLine:true,
        			showIcon:true,
        			nameIsHTML:true
        		},
        		async: {
        			enable: true,
        			url:"sjdx/getdata.do?dxdm=SYS_QX_QTQX",
        			autoParam:["dm=map['fqx']"],
        			otherParam:{"map['cllx']":"getTreeCN",
        			    //树模式=菜单树
        			    "map['treeModel']":'cds',
        			    //菜单树根节点
        			    "map['treeRoot']":this.treeroot},
        			dataFilter: treefilter
        		},
        		callback: {
        			onClick: treeClick
        		}
        	};
        	//树节点的单击事件
        	function treeClick(event, treeId, treeNode, clickFlag) {
        	    var mbdz = null;
        		if(treeNode.lx=='02'){
        			console.info('这是目录');
        		}else if(treeNode.dzlx=='02'){
        			//绝对地址
        		    mbdz = treeNode.dz;
        		}else if(treeNode.dzlx=='04'){
        			//数据对象
        			mbdz = "sjdx/list.do?dxdm="+treeNode.dz;
        		}else{
        			alert('暂未实现');
        		}
        		if(mbdz!=null){
					if(mbdz.indexOf("?")==-1){
					    mbdz += "?";
					}else{
					    mbdz += "&";
					}
        		    //添加权限编码
				    mbdz += "authCode="+treeNode.dm;
				    _this.centerLoading();
        			$("#gnIframe").attr("src",mbdz);
        		}
        	}
        	//处理后台返回的数据
        	function treefilter(treeId, parentNode, rep) {
        		if (!rep.status) return null;
        		var list = rep.data.list;
        		var cdList = [];
        		for (var i=0, l=list.length; i<l; i++) {
       				list[i].isParent=(list[i].parent>0);
       				cdList.push(list[i]);
        		}
        		return cdList;
        	}
        	//节点展示前的处理
        	function setNode(treeId, node) {
        		if(node.myIcon){
        			node.name='<i class="icon '+node.myIcon+'" style="color:red;"></i> '+node.name;
        		}
        		if(node.icon){
        			node.icon="file/download.do?id="+node.icon;
        		}
        		return {};
        	}
        	$.fn.zTree.init($('#leftTree-'+this.sjdxid), setting);
        }
	},
	mounted:function(){
        this.initTree();
	}
  });
</script>
