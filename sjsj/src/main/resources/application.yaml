  # 默认需要自动通过主键去获取数据库里记录的方法。
  mrputobj: save,update
  login:
    dlsbcs: 5
  service:
    addr: /index
  ljq:
    # 可以是springboot的bean名称（从容器中获取）或者具体的完整类路径（反射实例化，springboot的注解不会生效）
    default: MyDefaultLjq
  xtqx:
